name: Rebuild clean pencil levels

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-level-linework:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Convert floors, tiers, gaps, and stairs to clean one-line pencil geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          def replace_function(src, name, replacement):
              idx = src.find(f'function {name}(')
              if idx < 0:
                  return src, False
              brace = src.find('{', idx)
              if brace < 0:
                  return src, False
              depth = 0
              end = None
              in_str = None
              esc = False
              i = brace
              while i < len(src):
                  ch = src[i]
                  if in_str:
                      if esc:
                          esc = False
                      elif ch == '\\':
                          esc = True
                      elif ch == in_str:
                          in_str = None
                  else:
                      if ch in ('"', "'", '`'):
                          in_str = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i
                              break
                  i += 1
              if end is None:
                  return src, False
              return src[:idx] + replacement + src[end+1:], True

          def insert_before_first_function(src, code):
              idx = src.find('function ')
              return src[:idx] + code + '\n' + src[idx:] if idx >= 0 else src + '\n' + code

          # Hard rule: no fake thickness offsets. A floor/tier/stair is one visible pencil line only.
          s = re.sub(r"const\s+DESKTOP_STROKE_OFFSET\s*=\s*[^;]+;", "const DESKTOP_STROKE_OFFSET = 0;", s)

          # Ensure geometry arrays include ramps and cleanLevelLines.
          s = s.replace(
              'const platforms = [], ramps = [], spikes = [], potions = [], enemies = [], doors = [], fx = [];',
              'const platforms = [], ramps = [], cleanLevelLines = [], spikes = [], potions = [], enemies = [], doors = [], fx = [];'
          )
          s = s.replace(
              'const platforms = [], spikes = [], potions = [], enemies = [], doors = [], fx = [];',
              'const platforms = [], ramps = [], cleanLevelLines = [], spikes = [], potions = [], enemies = [], doors = [], fx = [];'
          )

          # Clear level-line storage whenever level geometry clears.
          s = s.replace('platforms.length = 0; ramps.length = 0;', 'platforms.length = 0; ramps.length = 0; cleanLevelLines.length = 0;')
          s = s.replace('platforms.length = 0;', 'platforms.length = 0; ramps.length = 0; cleanLevelLines.length = 0;')

          helpers = r"""
      function pencilPoint(x, y) {
        return new THREE.Vector3(x, y, 0);
      }

      function addPencilPolyline(points, mat = strokeMat) {
        const cleaned = [];
        for (const pt of points) {
          if (!pt) continue;
          if (!cleaned.length) {
            cleaned.push(pt);
            continue;
          }
          const last = cleaned[cleaned.length - 1];
          if (Math.abs(last.x - pt.x) > 0.001 || Math.abs(last.y - pt.y) > 0.001) cleaned.push(pt);
        }
        if (cleaned.length < 2) return null;
        const geo = new THREE.BufferGeometry().setFromPoints(cleaned);
        const line = new THREE.Line(geo, mat);
        scene.add(line);
        cleanLevelLines.push(line);
        return line;
      }

      function addCollisionPlatform(x1, y, x2) {
        if (!Number.isFinite(x1) || !Number.isFinite(y) || !Number.isFinite(x2)) return null;
        if (Math.abs(x2 - x1) < 0.45) return null;
        const a = Math.min(x1, x2);
        const b = Math.max(x1, x2);
        const platform = { x1: a, x2: b, y };
        platforms.push(platform);
        return platform;
      }

      function addCollisionRamp(x1, y1, x2, y2) {
        if (![x1, y1, x2, y2].every(Number.isFinite)) return null;
        if (Math.abs(x2 - x1) < 0.45) return null;
        const ramp = { x1, y1, x2, y2 };
        ramps.push(ramp);
        return ramp;
      }

      function createCleanPencilPath(points) {
        if (!Array.isArray(points) || points.length < 2) return null;
        const vecs = points.map(p => pencilPoint(p[0], p[1]));
        addPencilPolyline(vecs);
        for (let i = 0; i < points.length - 1; i++) {
          const [x1, y1] = points[i];
          const [x2, y2] = points[i + 1];
          if (Math.abs(y2 - y1) < 0.001) addCollisionPlatform(x1, y1, x2);
          else addCollisionRamp(x1, y1, x2, y2);
        }
        return vecs;
      }

      function makeStairPoints(x1, y1, x2, y2, steps = 6) {
        steps = Math.max(2, Math.round(steps || 6));
        const pts = [[x1, y1]];
        const dx = (x2 - x1) / steps;
        const dy = (y2 - y1) / steps;
        for (let i = 0; i < steps; i++) {
          const sx = x1 + dx * i;
          const sy = y1 + dy * i;
          pts.push([sx + dx, sy]);
          pts.push([sx + dx, sy + dy]);
        }
        return pts;
      }

      function createCleanStairPath(x1, y1, x2, y2, steps = 6) {
        const pts = makeStairPoints(x1, y1, x2, y2, steps);
        addPencilPolyline(pts.map(p => pencilPoint(p[0], p[1])));
        addCollisionRamp(x1, y1, x2, y2);
        addCollisionPlatform(x1, y1, x1 + (x2 - x1) / Math.max(2, Math.round(steps || 6)), y1);
        addCollisionPlatform(x2 - (x2 - x1) / Math.max(2, Math.round(steps || 6)), y2, x2, y2);
        return pts;
      }
"""
          if 'function createCleanPencilPath' not in s:
              s = insert_before_first_function(s, helpers)

          clean_add_line = """function addLineTo(group, pts, mat = strokeMat) {
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const line = new THREE.Line(geo, mat);
        group.add(line);
        return line;
      }"""
          s, _ = replace_function(s, 'addLineTo', clean_add_line)

          clean_platform = """function createPlatform(x1, y, x2) {
        return createCleanPencilPath([[x1, y], [x2, y]]);
      }"""
          s, _ = replace_function(s, 'createPlatform', clean_platform)

          # Replace every stair-like drawing function so it draws one continuous stepped pencil path plus one hidden ramp collider.
          stair_names = sorted(set(re.findall(r'function\s+([A-Za-z0-9_]*[Ss]tair[A-Za-z0-9_]*)\s*\(', s)))
          stair_template = """function __NAME__() {
        const args = Array.from(arguments).map(v => Number(v));
        const x1 = Number.isFinite(args[0]) ? args[0] : 0;
        const y1 = Number.isFinite(args[1]) ? args[1] : 0;
        let x2, y2, steps;

        if (args.length >= 5 && Math.abs((args[2] || 0) - x1) > 2) {
          x2 = args[2];
          y2 = args[3];
          steps = args[4];
        } else {
          steps = args[2] || 6;
          const stepW = Number.isFinite(args[3]) ? args[3] : 0.55;
          const stepH = Number.isFinite(args[4]) ? args[4] : 0.32;
          const dir = Number.isFinite(args[5]) ? Math.sign(args[5]) || 1 : 1;
          x2 = x1 + dir * Math.max(2, Math.round(steps)) * stepW;
          y2 = y1 + Math.max(2, Math.round(steps)) * stepH;
        }
        return createCleanStairPath(x1, y1, x2, y2, steps);
      }"""
          for name in stair_names:
              s, _ = replace_function(s, name, stair_template.replace('__NAME__', name))

          # Add ramp resolution in platformAt. This makes stairs walkable without needing visible extra lines.
          if 'for (const r of ramps)' not in s and 'function platformAt' in s:
              target = '        return null;\n      }\n      function resolveGround'
              ramp_logic = """        for (const r of ramps) {
          const minX = Math.min(r.x1, r.x2) - 0.26;
          const maxX = Math.max(r.x1, r.x2) + 0.26;
          if (x < minX || x > maxX) continue;
          const denom = (r.x2 - r.x1) || 1;
          const t = Math.max(0, Math.min(1, (x - r.x1) / denom));
          const ry = r.y1 + (r.y2 - r.y1) * t;
          const crossed = prevY >= ry - 0.04 && y <= ry + 0.14;
          const close = Math.abs(y - ry) < 0.20;
          if (playerVelocity.y <= 0 && (crossed || close)) return { x1: minX, x2: maxX, y: ry, ramp: true };
        }
"""
              if target in s:
                  s = s.replace(target, ramp_logic + target, 1)

          # Clear cleanLevelLines from scene if an older clearWorld function only removed grouped objects.
          if 'cleanLevelLines.forEach(line => scene.remove(line));' not in s:
              for fname in ['clearWorld', 'clearLevel', 'resetWorld']:
                  idx = s.find(f'function {fname}(')
                  if idx >= 0:
                      brace = s.find('{', idx)
                      s = s[:brace+1] + "\n        cleanLevelLines.forEach(line => { scene.remove(line); if (line.geometry) line.geometry.dispose(); });\n        cleanLevelLines.length = 0;" + s[brace+1:]
                      break

          # If Level 2 builder is obvious, replace it with the exact clean-pencil reference design:
          # one floor line, a real empty gap, continuous stairs, upper tier lines, and no rectangular/double platform drawings.
          level2_patterns = [
              r'function\s+buildLevel2\s*\([^)]*\)\s*\{',
              r'function\s+buildReferenceLevel\s*\([^)]*\)\s*\{'
          ]
          level2_replacement = """function buildLevel2() {
        createDoor(-7.4, 0.8, false);

        createCleanPencilPath([[-8, 0], [-5.2, 0], [-4.4, -0.35], [-2.6, -0.35], [-1.8, 0]]);
        createCleanStairPath(-1.8, 0, 3.8, 2.9, 8);
        createCleanPencilPath([[3.8, 2.9], [8.7, 2.9], [9.1, 0.65], [11.3, 0.65], [11.8, 2.25], [15.2, 2.25]]);
        createCleanStairPath(15.2, 2.25, 22.3, 6.2, 10);
        createCleanPencilPath([[22.3, 6.2], [26.0, 6.2], [26.35, 0.0], [30.0, 0.0]]);
        createCleanPencilPath([[31.8, 0.0], [36.0, 0.0]]);

        createPlatform(-1.7, 5.0, 4.5);
        createPlatform(27.5, 3.8, 32.8);
        createPlatform(34.7, 4.7, 38.5);

        createPotion(-4.2, -0.35);
        createPotion(0.6, 5.0);
        createPotion(10.4, 2.25);
        createPotion(23.4, 6.2);
        createPotion(29.2, 3.8);

        createEnemy(5.0, 2.9);
        createEnemy(7.4, 2.9);
        createEnemy(12.8, 2.25);
        createEnemy(23.6, 6.2);

        createSpike(9.25, 0.65);
        createSpike(26.7, 0.05);

        createDoor(35.2, 0.8, true);
      }"""
          replaced_level2 = False
          for pat in level2_patterns:
              m = re.search(pat, s)
              if m:
                  name = re.match(r'function\s+([A-Za-z0-9_]+)', m.group(0)).group(1)
                  repl = level2_replacement.replace('function buildLevel2', f'function {name}')
                  s, ok = replace_function(s, name, repl)
                  replaced_level2 = replaced_level2 or ok
                  break

          # Safety: remove any accidental zero-height rectangle/box platform calls created by old stair decorators.
          s = re.sub(r'\n\s*createPlatform\(([^\n;]*?)\);\s*//\s*(?:decorative|stair|step).*', '', s, flags=re.I)

          if 'function createCleanPencilPath' not in s:
              raise SystemExit('Clean pencil helpers missing after patch')
          if 'const DESKTOP_STROKE_OFFSET = 0;' not in s:
              raise SystemExit('Desktop double-line offset was not disabled')

          p.write_text(s)
          PY

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          start = s.find('<script>')
          end = s.rfind('</script>')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('No script block found')
          Path('/tmp/game.js').write_text(s[start + len('<script>'):end])
          PY
          node --check /tmp/game.js

      - name: Commit clean pencil geometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No clean-pencil changes needed"
          else
            git commit -m "Rebuild clean pencil level geometry"
            git push origin main
          fi
