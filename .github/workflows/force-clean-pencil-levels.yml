name: Force clean pencil levels

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  force-clean-pencil-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rewrite line rendering, stairs, and gaps as clean pencil geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          def replace_function(src, name, replacement):
              idx = src.find(f'function {name}(')
              if idx < 0:
                  return src, False
              brace = src.find('{', idx)
              if brace < 0:
                  return src, False
              depth = 0
              end = None
              quote = None
              esc = False
              for i in range(brace, len(src)):
                  ch = src[i]
                  if quote:
                      if esc:
                          esc = False
                      elif ch == '\\':
                          esc = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ('"', "'", '`'):
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i
                              break
              if end is None:
                  raise RuntimeError(f'Could not parse function {name}')
              return src[:idx] + replacement + src[end+1:], True

          # Disable the desktop duplicate-line trick completely. It made floors look like rectangles/double gaps.
          s = re.sub(r"const\s+DESKTOP_STROKE_OFFSET\s*=\s*[^;]+;", "const DESKTOP_STROKE_OFFSET = 0;", s)

          # Add clean geometry arrays.
          s = s.replace('const platforms = [], ramps = [], cleanLevelLines = [], spikes = [], potions = [], enemies = [], doors = [], fx = [];',
                        'const platforms = [], ramps = [], cleanLevelLines = [], spikes = [], potions = [], enemies = [], doors = [], fx = [];')
          s = s.replace('const platforms = [], ramps = [], spikes = [], potions = [], enemies = [], doors = [], fx = [];',
                        'const platforms = [], ramps = [], cleanLevelLines = [], spikes = [], potions = [], enemies = [], doors = [], fx = [];')
          s = s.replace('const platforms = [], spikes = [], potions = [], enemies = [], doors = [], fx = [];',
                        'const platforms = [], ramps = [], cleanLevelLines = [], spikes = [], potions = [], enemies = [], doors = [], fx = [];')

          # Ensure arrays clear together.
          s = s.replace('platforms.length = 0; ramps.length = 0; cleanLevelLines.length = 0;', 'platforms.length = 0; ramps.length = 0; cleanLevelLines.length = 0;')
          s = s.replace('platforms.length = 0; ramps.length = 0;', 'platforms.length = 0; ramps.length = 0; cleanLevelLines.length = 0;')
          s = s.replace('platforms.length = 0;', 'platforms.length = 0; ramps.length = 0; cleanLevelLines.length = 0;')

          helpers = '''
      function pencilPoint(x, y) {
        return new THREE.Vector3(x, y, 0);
      }

      function addCleanLevelLine(points, mat = strokeMat) {
        const cleaned = [];
        for (const pt of points) {
          if (!pt) continue;
          if (!cleaned.length) { cleaned.push(pt); continue; }
          const last = cleaned[cleaned.length - 1];
          if (Math.abs(last.x - pt.x) > 0.001 || Math.abs(last.y - pt.y) > 0.001) cleaned.push(pt);
        }
        if (cleaned.length < 2) return null;
        const geo = new THREE.BufferGeometry().setFromPoints(cleaned);
        const line = new THREE.Line(geo, mat);
        scene.add(line);
        cleanLevelLines.push(line);
        return line;
      }

      function addCollisionPlatformOnly(x1, y, x2) {
        if (![x1, y, x2].every(Number.isFinite)) return null;
        if (Math.abs(x2 - x1) < 0.45) return null;
        const a = Math.min(x1, x2);
        const b = Math.max(x1, x2);
        const platform = { x1: a, x2: b, y };
        platforms.push(platform);
        return platform;
      }

      function addCollisionRampOnly(x1, y1, x2, y2) {
        if (![x1, y1, x2, y2].every(Number.isFinite)) return null;
        if (Math.abs(x2 - x1) < 0.45) return null;
        const ramp = { x1, y1, x2, y2 };
        ramps.push(ramp);
        return ramp;
      }

      function createCleanPencilPath(points) {
        if (!Array.isArray(points) || points.length < 2) return null;
        addCleanLevelLine(points.map(p => pencilPoint(p[0], p[1])));
        for (let i = 0; i < points.length - 1; i++) {
          const [x1, y1] = points[i];
          const [x2, y2] = points[i + 1];
          if (Math.abs(y2 - y1) < 0.001) addCollisionPlatformOnly(x1, y1, x2);
          else addCollisionRampOnly(x1, y1, x2, y2);
        }
        return null;
      }

      function createCleanStairPath(x1, y1, x2, y2, steps = 6) {
        steps = Math.max(2, Math.round(steps || 6));
        const dx = (x2 - x1) / steps;
        const dy = (y2 - y1) / steps;
        const pts = [[x1, y1]];
        for (let i = 0; i < steps; i++) {
          const sx = x1 + dx * i;
          const sy = y1 + dy * i;
          pts.push([sx + dx, sy]);
          pts.push([sx + dx, sy + dy]);
        }
        addCleanLevelLine(pts.map(p => pencilPoint(p[0], p[1])));
        addCollisionRampOnly(x1, y1, x2, y2);
        addCollisionPlatformOnly(x1, y1, x1 + dx, y1);
        addCollisionPlatformOnly(x2 - dx, y2, x2, y2);
        return null;
      }
'''
          if 'function createCleanPencilPath(points)' not in s:
              idx = s.find('function ')
              s = s[:idx] + helpers + '\n' + s[idx:]

          # Clean regular helper: no fake offset copies.
          add_line = '''function addLineTo(group, pts, mat = strokeMat) {
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const line = new THREE.Line(geo, mat);
        group.add(line);
        return line;
      }'''
          s, _ = replace_function(s, 'addLineTo', add_line)

          # Platform is now one visible pencil line only.
          if 'function createPlatform(' in s:
              s, _ = replace_function(s, 'createPlatform', '''function createPlatform(x1, y, x2) {
        return createCleanPencilPath([[x1, y], [x2, y]]);
      }''')

          # Make any stair function draw one continuous stair polyline plus hidden ramp collider.
          stair_names = sorted(set(re.findall(r'function\s+([A-Za-z0-9_]*[Ss]tair[A-Za-z0-9_]*)\s*\(', s)))
          for name in stair_names:
              repl = f'''function {name}() {{
        const args = Array.from(arguments).map(v => Number(v));
        const x1 = Number.isFinite(args[0]) ? args[0] : 0;
        const y1 = Number.isFinite(args[1]) ? args[1] : 0;
        let x2, y2, steps;
        if (args.length >= 5 && Math.abs((args[2] || 0) - x1) > 2) {{
          x2 = args[2];
          y2 = args[3];
          steps = args[4];
        }} else {{
          steps = args[2] || 6;
          const stepW = Number.isFinite(args[3]) ? args[3] : 0.55;
          const stepH = Number.isFinite(args[4]) ? args[4] : 0.32;
          const dir = Number.isFinite(args[5]) ? Math.sign(args[5]) || 1 : 1;
          x2 = x1 + dir * Math.max(2, Math.round(steps)) * stepW;
          y2 = y1 + Math.max(2, Math.round(steps)) * stepH;
        }}
        return createCleanStairPath(x1, y1, x2, y2, steps);
      }}'''
              s, _ = replace_function(s, name, repl)

          # Add ramp support inside platformAt if missing.
          if 'for (const r of ramps)' not in s and 'function platformAt' in s:
              marker = '        return null;\n      }\n      function resolveGround'
              ramp_code = '''        for (const r of ramps) {
          const minX = Math.min(r.x1, r.x2) - 0.26;
          const maxX = Math.max(r.x1, r.x2) + 0.26;
          if (x < minX || x > maxX) continue;
          const denom = (r.x2 - r.x1) || 1;
          const t = Math.max(0, Math.min(1, (x - r.x1) / denom));
          const ry = r.y1 + (r.y2 - r.y1) * t;
          const crossed = prevY >= ry - 0.04 && y <= ry + 0.14;
          const close = Math.abs(y - ry) < 0.20;
          if (playerVelocity.y <= 0 && (crossed || close)) return { x1: minX, x2: maxX, y: ry, ramp: true };
        }
'''
              s = s.replace(marker, ramp_code + marker, 1)

          # If clear function exists, remove clean lines from scene before rebuilding.
          if 'cleanLevelLines.forEach(line => { scene.remove(line);' not in s:
              for fname in ('clearWorld', 'clearLevel', 'resetWorld'):
                  idx = s.find(f'function {fname}(')
                  if idx >= 0:
                      brace = s.find('{', idx)
                      s = s[:brace+1] + '''
        cleanLevelLines.forEach(line => { scene.remove(line); if (line.geometry) line.geometry.dispose(); });
        cleanLevelLines.length = 0;''' + s[brace+1:]
                      break

          if 'const DESKTOP_STROKE_OFFSET = 0;' not in s:
              raise SystemExit('desktop stroke offset still active')
          if 'function createCleanPencilPath(points)' not in s:
              raise SystemExit('clean pencil helpers missing')
          if 'const platforms = [], ramps = [], cleanLevelLines = []' not in s:
              raise SystemExit('clean geometry arrays missing')

          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          start = s.find('<script>')
          end = s.rfind('</script>')
          Path('/tmp/game.js').write_text(s[start + len('<script>'):end])
          PY
          node --check /tmp/game.js
      - name: Commit patch to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Force clean pencil geometry"
            git push origin main
          fi
