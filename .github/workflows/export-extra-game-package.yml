name: Export extra game packages

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Export additional game repositories
        shell: bash
        run: |
          set -u
          mkdir -p extra/repos extra/zips extra/reports extra/screenshots
          repos=(
            kids-match
            kids-memory-game
            kids-word-finder
            kids-find-your-destiny
            kids-svg-game
            kids-slider-game
            punch-game
            threadbound-game
            bounce-game
            klotski-game
            ball-sorting-puzzle
            stickmans-homework
            Alignment-Whack-a-Mole-Code
            legocraft
          )
          printf 'repository,status,commit,commit_date,default_branch\n' > extra/reports/repository_manifest.csv
          for repo in "${repos[@]}"; do
            target="extra/repos/$repo"
            if git clone --depth 1 "https://github.com/Joenasriani/$repo.git" "$target"; then
              commit=$(git -C "$target" rev-parse HEAD)
              commit_date=$(git -C "$target" log -1 --format=%cI)
              branch=$(git -C "$target" branch --show-current)
              printf '%s,cloned,%s,%s,%s\n' "$repo" "$commit" "$commit_date" "$branch" >> extra/reports/repository_manifest.csv
              rm -rf "$target/.git"
              (cd "$target" && zip -qr "../../zips/${repo}-latest-github.zip" . -x '*.DS_Store' -x '__MACOSX/*')
            else
              printf '%s,missing,,,\n' "$repo" >> extra/reports/repository_manifest.csv
              rm -rf "$target"
            fi
          done

      - name: Static checks
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path
          from urllib.parse import unquote
          root=Path('extra/repos'); reports=Path('extra/reports')
          ref_re=re.compile(r'''(?:src|href)\s*=\s*["']([^"']+)["']|url\(\s*["']?([^\)"']+)''',re.I)
          rows=[]
          for d in sorted(p for p in root.iterdir() if p.is_dir()):
              files=[p for p in d.rglob('*') if p.is_file()]
              candidates=[d/x for x in ('index.html','dist/index.html','docs/index.html','public/index.html','frontend/public/index.html','build/index.html') if (d/x).exists()]
              if not candidates: candidates=sorted(d.rglob('index.html'))[:5]
              entry=candidates[0] if candidates else None
              missing=[]; external=[]
              if entry:
                  text=entry.read_text('utf-8',errors='replace')
                  for m in ref_re.finditer(text):
                      ref=(m.group(1) or m.group(2) or '').strip()
                      if not ref or ref.startswith(('#','data:','blob:','javascript:','mailto:','tel:','%PUBLIC_URL%')): continue
                      if re.match(r'^https?://',ref,re.I) or ref.startswith('//'): external.append(ref); continue
                      clean=unquote(ref.split('?',1)[0].split('#',1)[0])
                      target=(entry.parent/clean).resolve()
                      try: target.relative_to(d.resolve())
                      except ValueError: missing.append(ref); continue
                      if not target.exists(): missing.append(ref)
              status='static-pass' if entry and not missing else 'static-review-required'
              out={'repository':d.name,'entry':str(entry.relative_to(d)) if entry else None,'file_count':len(files),'missing_references':sorted(set(missing)),'external_dependencies':sorted(set(external)),'status':status}
              (reports/f'{d.name}-static.json').write_text(json.dumps(out,indent=2))
              rows.append(out)
          with (reports/'static_summary.csv').open('w',newline='') as f:
              w=csv.writer(f); w.writerow(['repository','status','entry','files','missing_refs','external_dependencies'])
              for x in rows: w.writerow([x['repository'],x['status'],x['entry'] or '',x['file_count'],len(x['missing_references']),len(x['external_dependencies'])])
          PY

      - name: Basic browser checks
        shell: bash
        run: |
          set -u
          CHROME_BIN=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME_BIN" ]; then exit 0; fi
          mkdir -p /tmp/extra-browser && cd /tmp/extra-browser
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.54.1 >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 8766 --directory extra/repos >/tmp/extra-http.log 2>&1 &
          SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 2
          cat > /tmp/extra-browser/audit.js <<'JS'
          const fs=require('fs'), path=require('path'); const {chromium}=require('playwright-core');
          (async()=>{const b=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
          for(const repo of fs.readdirSync(process.env.ROOT).sort()) {const sf=path.join(process.env.REPORTS,`${repo}-static.json`); if(!fs.existsSync(sf))continue; const s=JSON.parse(fs.readFileSync(sf)); if(!s.entry)continue;
          const p=await b.newPage({viewport:{width:1365,height:768}}), pe=[], ce=[], rf=[]; p.on('pageerror',e=>pe.push(String(e))); p.on('console',m=>{if(m.type()==='error')ce.push(m.text())}); p.on('requestfailed',r=>rf.push(r.url())); let nav=null, text='', canvases=0;
          try{await p.goto(`http://127.0.0.1:8766/${encodeURIComponent(repo)}/${s.entry.split('/').map(encodeURIComponent).join('/')}`,{waitUntil:'domcontentloaded',timeout:20000}); await p.waitForTimeout(2500); const starts=p.getByRole('button',{name:/start|play|begin|enter|continue|run/i}); if(await starts.count())try{await starts.first().click({timeout:2500});await p.waitForTimeout(1500)}catch(_){}; text=(await p.locator('body').innerText()).slice(0,1500); canvases=await p.locator('canvas').count(); await p.screenshot({path:path.join(process.env.SHOTS,`${repo}.png`)})}catch(e){nav=String(e)};
          fs.writeFileSync(path.join(process.env.REPORTS,`${repo}-runtime.json`),JSON.stringify({repository:repo,entry:s.entry,navigation_error:nav,canvas_count:canvases,body_text_sample:text,page_errors:pe,console_errors:ce,failed_requests:rf,status:(!nav&&pe.length===0&&text.length>0)?'runtime-basic-pass':'runtime-review-required'},null,2)); await p.close();}
          await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          CHROME_BIN="$CHROME_BIN" ROOT="$GITHUB_WORKSPACE/extra/repos" REPORTS="$GITHUB_WORKSPACE/extra/reports" SHOTS="$GITHUB_WORKSPACE/extra/screenshots" node /tmp/extra-browser/audit.js || true

      - name: Package additional collection
        shell: bash
        run: |
          (cd extra && zip -qr ../latest-extra-games-github-audit-collection.zip zips reports screenshots)

      - name: Upload additional collection
        uses: actions/upload-artifact@v4
        with:
          name: latest-extra-games-github-audit-collection
          path: latest-extra-games-github-audit-collection.zip
          if-no-files-found: error
          retention-days: 1
