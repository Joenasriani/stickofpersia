name: Cleanup main game design

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html design cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          def replace_function(src, name, replacement):
              idx = src.find(f'function {name}(')
              if idx < 0:
                  return src, False
              brace = src.find('{', idx)
              if brace < 0:
                  return src, False
              depth = 0
              end = None
              for i in range(brace, len(src)):
                  ch = src[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
              if end is None:
                  return src, False
              return src[:idx] + replacement + src[end+1:], True

          # 1) Remove artificial duplicate desktop line offsets. These were causing visible double-lines
          # that looked like gaps and made platforms/stairs appear dirty.
          s = re.sub(r"const\s+DESKTOP_STROKE_OFFSET\s*=\s*[^;]+;", "const DESKTOP_STROKE_OFFSET = 0;", s)

          clean_add_line = """function addLineTo(group, pts, mat = strokeMat) {
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const line = new THREE.Line(geo, mat);
        group.add(line);
        return line;
      }"""
          s, _ = replace_function(s, 'addLineTo', clean_add_line)

          # 2) Add explicit ramp colliders for stairs so stairs are walkable as continuous ground.
          # This keeps the visual steps but prevents the player from falling between step segments.
          if 'const platforms = [], ramps = [], spikes = [], potions = [], enemies = [], doors = [], fx = [];' not in s:
              s = s.replace(
                  'const platforms = [], spikes = [], potions = [], enemies = [], doors = [], fx = [];',
                  'const platforms = [], ramps = [], spikes = [], potions = [], enemies = [], doors = [], fx = [];'
              )

          # Clear ramps when level/world data is cleared.
          if 'ramps.length = 0;' not in s:
              s = s.replace('platforms.length = 0;', 'platforms.length = 0; ramps.length = 0;')

          # Patch platformAt to test ramp colliders first. Insert before final return null.
          if 'for (const r of ramps)' not in s and 'function platformAt' in s:
              marker = '        return null;\n      }\n      function resolveGround'
              ramp_code = """        for (const r of ramps) {
          const minX = Math.min(r.x1, r.x2) - 0.24;
          const maxX = Math.max(r.x1, r.x2) + 0.24;
          if (x < minX || x > maxX) continue;
          const denom = (r.x2 - r.x1) || 1;
          const t = Math.max(0, Math.min(1, (x - r.x1) / denom));
          const ry = r.y1 + (r.y2 - r.y1) * t;
          const crossed = prevY >= ry - 0.04 && y <= ry + 0.12;
          const close = Math.abs(y - ry) < 0.18;
          if (playerVelocity.y <= 0 && (crossed || close)) return { x1: minX, x2: maxX, y: ry, ramp: true };
        }
"""
              if marker in s:
                  s = s.replace(marker, ramp_code + marker, 1)

          # 3) Replace existing stair functions with a clean implementation. It supports both common call styles:
          # createStairX(x, y, steps, stepW, stepH, dir) OR createStairX(x1, y1, x2, y2, steps).
          stair_names = sorted(set(re.findall(r'function\s+([A-Za-z0-9_]*[Ss]tair[A-Za-z0-9_]*)\s*\(', s)))
          clean_stair_template = """function __NAME__() {
        const args = Array.from(arguments).map(v => Number(v));
        const x1 = Number.isFinite(args[0]) ? args[0] : 0;
        const y1 = Number.isFinite(args[1]) ? args[1] : 0;
        let x2, y2, steps;

        if (args.length >= 5 && Math.abs((args[2] || 0) - x1) > 2) {
          x2 = args[2];
          y2 = args[3];
          steps = Math.max(2, Math.round(args[4] || 6));
        } else {
          steps = Math.max(2, Math.round(args[2] || 6));
          const stepW = Number.isFinite(args[3]) ? args[3] : 0.55;
          const stepH = Number.isFinite(args[4]) ? args[4] : 0.32;
          const dir = Number.isFinite(args[5]) ? Math.sign(args[5]) || 1 : 1;
          x2 = x1 + dir * steps * stepW;
          y2 = y1 + steps * stepH;
        }

        const group = new THREE.Group();
        const dx = (x2 - x1) / steps;
        const dy = (y2 - y1) / steps;
        const pts = [];
        pts.push(new THREE.Vector3(x1, y1, 0));
        for (let i = 0; i < steps; i++) {
          const sx = x1 + dx * i;
          const sy = y1 + dy * i;
          pts.push(new THREE.Vector3(sx + dx, sy, 0));
          pts.push(new THREE.Vector3(sx + dx, sy + dy, 0));
        }
        addLineTo(group, pts);
        scene.add(group);
        ramps.push({ x1, y1, x2, y2, group });
        return group;
      }"""
          for name in stair_names:
              s, _ = replace_function(s, name, clean_stair_template.replace('__NAME__', name))

          # 4) Remove meaningless micro-platforms: tiny horizontal platform segments that read as gaps/stray lines.
          # Keep real platforms and door ledges. This is conservative: only removes very short level geometry lines.
          micro_cleanup = """\n      function isMeaningfulPlatform(x1, x2) {\n        return Math.abs(x2 - x1) >= 0.75;\n      }\n"""
          if 'function isMeaningfulPlatform' not in s:
              insert_after = 'function createPlatform(x1, y, x2) {'
              idx = s.find(insert_after)
              if idx >= 0:
                  s = s[:idx] + micro_cleanup + s[idx:]
          if 'if (!isMeaningfulPlatform(x1, x2)) return null;' not in s:
              s = s.replace(
                  'function createPlatform(x1, y, x2) {\n',
                  'function createPlatform(x1, y, x2) {\n        if (!isMeaningfulPlatform(x1, x2)) return null;\n',
                  1
              )

          # Basic syntax sanity: check for duplicate broken declarations from patching.
          if 'const platforms = [], ramps = [], spikes = []' not in s:
              raise SystemExit('Patch failed: ramp array declaration not found after cleanup.')
          if 'function addLineTo(group, pts, mat = strokeMat)' not in s:
              raise SystemExit('Patch failed: clean addLineTo missing.')

          p.write_text(s)
          PY
      - name: Validate JavaScript syntax section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          start = s.find('<script>')
          end = s.rfind('</script>')
          js = s[start+8:end]
          Path('/tmp/game.js').write_text(js)
          PY
          node --check /tmp/game.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No cleanup changes needed"
          else
            git commit -m "Clean level linework and stair collision"
            git push origin main
          fi
