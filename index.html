<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>In a Stickman's World</title>
  <style>
    @font-face {
      font-family: 'StickBubble';
      src: url('./fonts/bubble.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --touch-gap: 10px;
      --touch-action-h: clamp(56px, 9.5vw, 72px);
      --touch-stack-h: calc(var(--touch-action-h) * 3 + var(--touch-gap) * 2);
    }
html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      touch-action: none;
      font-family: monospace;
    }
    canvas { display: block; touch-action: none; }
    #ui {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: calc(16px + env(safe-area-inset-left, 0px));
      right: calc(16px + env(safe-area-inset-right, 0px));
      z-index: 10;
      font-size: 15px;
      font-weight: bold;
      color: #000;
      line-height: 1.45;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #topRow {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: auto;
    }
    .hudCluster {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      max-width: 62%;
    }
    .statPill {
      background: rgba(255,255,255,0.95);
      border: 2px solid #000;
      padding: 7px 10px;
      box-shadow: 4px 4px 0 #000;
    }
    .utilityCluster {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      max-width: 38%;
    }
    button {
      font-family: monospace;
      font-weight: bold;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      padding: 8px 12px;
      cursor: pointer;
      box-shadow: 4px 4px 0 #000;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .utilityBtn {
      min-width: 86px;
      text-align: center;
    }
    .musicVolumeControl {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(255,255,255,0.95);
      border: 2px solid #000;
      padding: 7px 8px;
      box-shadow: 4px 4px 0 #000;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      box-sizing: border-box;
      overflow: hidden;
    }
    .musicVolumeControl label {
      white-space: nowrap;
      flex: 0 0 auto;
    }
    #musicVolumeSlider {
      width: 58px;
      min-width: 42px;
      max-width: 58px;
      accent-color: #000;
      cursor: pointer;
      touch-action: manipulation;
      flex: 0 1 auto;
    }
    button:active, button.active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; background: #eee; }
    body.modalOpen #ui,
    body.modalOpen #touchControls {
      opacity: 0.14;
      pointer-events: none;
    }
    body.modalOpen #msg {
      pointer-events: auto;
    }
    #hint { margin-top: 6px; font-size: 12px; opacity: 0.75; }
    #msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      background: #fff;
      border: 2px solid #000;
      padding: 28px;
      display: none;
      text-align: center;
      min-width: 220px;
      box-shadow: 8px 8px 0 #000;
    }
    #levelBanner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 28;
      display: none;
      background: rgba(255,255,255,0.94);
      border: 2px solid #000;
      box-shadow: 8px 8px 0 #000;
      padding: 10px 14px;
      width: min(150px, calc(100vw - 190px));
      aspect-ratio: 4 / 5;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-size: clamp(22px, 5vw, 42px);
      font-weight: 900;
      text-transform: uppercase;
      pointer-events: none;
    }
    #touchControls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      padding: 0 clamp(12px, 3vw, 18px);
      box-sizing: border-box;
      pointer-events: none;
    }
    .padGroup { display: flex; gap: var(--touch-gap); pointer-events: auto; }
    .padGroup.vertical { flex-direction: column; align-items: stretch; }
    .movePad {
      align-items: stretch;
    }
    .actionPad {
      justify-content: flex-end;
    }
    .touchBtn {
      min-width: clamp(62px, 16vw, 92px);
      min-height: var(--touch-action-h);
      font-size: clamp(12px, 2.8vw, 14px);
      white-space: nowrap;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.05;
      box-sizing: border-box;
    }
    .movePad {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .movePad .touchBtn {
      width: 100%;
      flex: 1 1 0;
    }
    #intro {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: #fff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #introCard {
      width: min(820px, calc(100vw - 28px));
      min-height: 0;
      border: 2px solid #000;
      box-shadow: 10px 10px 0 #000;
      padding: 26px;
      box-sizing: border-box;
      background: #fff;
    }
    #introTitle {
      margin: 0;
      line-height: 0.86;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
    }
    #introTitle .smallTitle,
    #introTitle .bigTitle {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: normal;
      font-weight: 400;
    }
    #introTitle .smallTitle {
      font-size: clamp(30px, 5vw, 58px);
      letter-spacing: 0.05em;
      transform: skewX(-8deg);
      border-bottom: 2px solid #000;
      padding-bottom: 6px;
      margin-bottom: 4px;
    }
    #introTitle .bigTitle {
      font-size: clamp(46px, 9vw, 98px);
      letter-spacing: 0.01em;
      text-shadow: 4px 4px 0 rgba(0,0,0,0.12);
    }
    #introSubtitle {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-top: 2px solid #000;
      border-bottom: 2px solid #000;
      padding: 10px 0;
      margin: 18px 0 18px;
    }
    #introText { margin-top: 24px; min-height: 64px; font-size: 15px; line-height: 1.5; }
    #introPrompt {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #startButton {
      font-size: 15px;
      padding: 12px 18px;
      min-width: 148px;
    }


    @media (max-width: 900px), (pointer: coarse) {
      #touchControls { display: flex; }
      #hint { display: none; }
      #ui { font-size: 13px; }
      #topRow { flex-direction: column; align-items: stretch; gap: 10px; }
      .hudCluster, .utilityCluster { max-width: 100%; }
      .hudCluster { width: 100%; justify-content: space-between; }
      .utilityCluster {
        width: 100%;
        max-width: none;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        justify-content: stretch;
      }
      .utilityBtn {
        width: 100%;
        min-width: 0;
        padding-left: 8px;
        padding-right: 8px;
      }
      .musicVolumeControl {
        width: 100%;
        min-width: 0;
        padding-left: 5px;
        padding-right: 5px;
        gap: 4px;
      }
      .musicVolumeControl label {
        font-size: 11px;
      }
      #musicVolumeSlider {
        width: 44px;
        min-width: 34px;
        max-width: 44px;
      }
      .statPill {
        flex: 1 1 0;
        text-align: center;
      }
      #introCard { min-height: 0; padding: 20px; }
      #introPrompt { align-items: stretch; }
      #startButton { width: 100%; }
    }

    @media (pointer: coarse) and (orientation: portrait), (max-width: 640px) and (orientation: portrait) {
      #touchControls {
        align-items: stretch;
      }
      .movePad {
        flex: 0 0 auto;
        display: flex;
        align-items: stretch;
        height: var(--touch-stack-h);
        align-self: stretch;
      }
      .movePad .touchBtn {
        width: clamp(62px, 16vw, 92px);
        min-width: clamp(62px, 16vw, 92px);
        min-height: var(--touch-stack-h);
        height: var(--touch-stack-h);
        flex: 0 0 auto;
        align-self: stretch;
      }
      .actionPad {
        flex: 0 0 auto;
      }
      .actionPad .touchBtn {
        min-width: clamp(72px, 20vw, 104px);
      }
    }

    @media (pointer: coarse) and (orientation: landscape) {
      :root {
        --touch-gap: 8px;
        --touch-action-h: clamp(42px, 12vh, 54px);
      }
      #ui {
        top: calc(7px + env(safe-area-inset-top, 0px));
        left: calc(8px + env(safe-area-inset-left, 0px));
        right: calc(8px + env(safe-area-inset-right, 0px));
        font-size: clamp(10px, 1.9vw, 12px);
      }
      #topRow {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        flex-wrap: nowrap;
        gap: 6px;
        width: 100%;
      }
      .hudCluster,
      .utilityCluster {
        width: auto;
        max-width: none;
        display: flex;
        flex: 0 1 auto;
        flex-wrap: nowrap;
        gap: 6px;
        align-items: center;
        justify-content: center;
      }
      .statPill,
      .utilityBtn,
      .musicVolumeControl {
        height: clamp(34px, 10vh, 42px);
        min-height: clamp(34px, 10vh, 42px);
        padding: 0 8px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-shadow: 3px 3px 0 #000;
        background: rgba(255,255,255,0.88);
        line-height: 1;
        white-space: nowrap;
      }
      .statPill {
        flex: 0 0 auto;
        min-width: clamp(78px, 13vw, 118px);
      }
      .utilityBtn {
        flex: 0 0 auto;
        min-width: clamp(58px, 9.5vw, 88px);
        width: auto;
        font-size: clamp(10px, 1.9vw, 12px);
      }
      .musicVolumeControl {
        flex: 0 0 auto;
        width: clamp(110px, 18vw, 145px);
        min-width: clamp(110px, 18vw, 145px);
        gap: 5px;
      }
      .musicVolumeControl label {
        font-size: clamp(10px, 1.8vw, 12px);
        line-height: 1;
      }
      #musicVolumeSlider {
        width: clamp(42px, 7vw, 62px);
        min-width: clamp(42px, 7vw, 62px);
        max-width: clamp(42px, 7vw, 62px);
      }
      #touchControls {
        bottom: calc(9px + env(safe-area-inset-bottom, 0px));
        padding-left: calc(12px + env(safe-area-inset-left, 0px));
        padding-right: calc(12px + env(safe-area-inset-right, 0px));
        align-items: flex-end;
        gap: 10px;
      }
      .touchBtn {
        min-width: clamp(66px, 10vw, 88px);
        min-height: var(--touch-action-h);
        height: var(--touch-action-h);
        font-size: clamp(12px, 2.5vw, 14px);
        padding: 6px 8px;
        box-shadow: 3px 3px 0 #000;
      }
      .movePad {
        display: flex;
        flex: 0 0 auto;
        height: auto;
        align-items: flex-end;
      }
      .movePad .touchBtn {
        width: clamp(66px, 10vw, 88px);
        min-width: clamp(66px, 10vw, 88px);
        min-height: var(--touch-action-h);
        height: var(--touch-action-h);
        flex: 0 0 auto;
      }
      .actionPad {
        flex: 0 0 auto;
      }
      .actionPad .touchBtn {
        min-width: clamp(74px, 12vw, 96px);
      }
      #msg {
        width: min(42vw, 430px);
        max-width: calc(100vw - 220px);
        min-width: 230px;
        padding: 18px 22px;
        z-index: 45;
      }
      #levelBanner {
        width: auto;
        min-width: clamp(120px, 18vw, 190px);
        max-width: calc(100vw - 260px);
        height: clamp(48px, 15vh, 74px);
        min-height: 0;
        aspect-ratio: auto;
        padding: 6px 16px;
        box-shadow: 5px 5px 0 #000;
        white-space: nowrap;
        line-height: 1;
      }
      #intro {
        padding: calc(8px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px));
        box-sizing: border-box;
      }
      #introCard {
        width: min(560px, calc(100vw - 88px));
        max-height: calc(100dvh - 20px);
        padding: clamp(8px, 2.2vh, 14px);
        box-shadow: 5px 5px 0 #000;
        overflow: hidden;
      }
      #introTitle {
        gap: clamp(2px, 0.9vh, 5px);
      }
      #introTitle .smallTitle {
        font-size: clamp(20px, 7vh, 34px);
        padding-bottom: clamp(2px, 0.8vh, 4px);
        margin-bottom: clamp(1px, 0.5vh, 2px);
      }
      #introTitle .bigTitle {
        font-size: clamp(34px, 13vh, 58px);
        line-height: 0.82;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.12);
      }
      #introSubtitle {
        font-size: clamp(8px, 2.4vh, 10px);
        letter-spacing: clamp(1.4px, 0.5vw, 2px);
        padding: clamp(4px, 1.3vh, 6px) 0;
        margin: clamp(6px, 1.8vh, 9px) 0;
      }
      #introText {
        min-height: 0;
        margin-top: clamp(6px, 1.7vh, 9px);
        font-size: clamp(10px, 2.8vh, 13px);
        line-height: 1.25;
      }
      #introPrompt {
        margin-top: clamp(6px, 1.7vh, 9px);
        gap: 8px;
        font-size: clamp(8px, 2.3vh, 10px);
        letter-spacing: clamp(0.8px, 0.28vw, 1.2px);
      }
      #startButton {
        font-size: clamp(11px, 2.8vh, 13px);
        padding: clamp(6px, 1.7vh, 8px) 12px;
        min-width: 132px;
        box-shadow: 3px 3px 0 #000;
      }
    }

    @media (max-width: 430px) {
      #ui {
        top: calc(10px + env(safe-area-inset-top, 0px));
        left: calc(10px + env(safe-area-inset-left, 0px));
        right: calc(10px + env(safe-area-inset-right, 0px));
      }
      .statPill,
      .utilityBtn {
        box-shadow: 3px 3px 0 #000;
      }
      #msg {
        width: min(88vw, 320px);
        min-width: 0;
        padding: 22px 18px;
      }
    }
  </style>
</head>
<body>
  <div id="intro">
    <div id="introCard">
      <h1 id="introTitle"><span class="smallTitle">In a</span><span class="bigTitle">Stickman's World</span></h1>
      <div id="introSubtitle">Retro stickman world</div>
      <div id="introText">At the zenith of a broken prophecy, a line-born stickman promises the moon to reshape destiny.</div>
      <div id="introPrompt"><span>Run. Leap. Block. Strike.</span><button id="startButton">START QUEST</button></div>
    </div>
  </div>

  <div id="ui">
    <div id="topRow">
      <div class="hudCluster">
        <div id="hpDisplay" class="statPill">HP: 5/5</div>
        <div id="walletDisplay" class="statPill">Wallet: 50 AED</div>
      </div>
      <div class="utilityCluster">
        <button id="buyButton" class="utilityBtn">Health +1</button>
        <button id="soundButton" class="utilityBtn" aria-label="Mute or unmute audio">MUTE</button>
        <div class="musicVolumeControl" aria-label="Music volume control">
          <label for="musicVolumeSlider">MUSIC</label>
          <input id="musicVolumeSlider" type="range" min="0" max="100" value="16" />
        </div>
        <button id="restartTouch" class="utilityBtn">Restart</button>
      </div>
    </div>
    <div id="hint">Arrow keys: move | Space: attack | Down: block | Up: jump | R: restart</div>
  </div>

  <div id="msg"><h2 id="msgText"></h2><button id="restartButton">RESTART</button></div>
  <div id="levelBanner">LEVEL 1</div>

  <div id="touchControls">
    <div class="padGroup movePad">
      <button class="touchBtn" data-key="ArrowLeft">LEFT</button>
      <button class="touchBtn" data-key="ArrowRight">RIGHT</button>
    </div>
    <div class="padGroup vertical actionPad">
      <button class="touchBtn" data-key="ArrowUp">JUMP</button>
      <button class="touchBtn" data-key=" ">ATTACK</button>
      <button class="touchBtn" data-key="ArrowDown">BLOCK</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function () {
      'use strict';

      if (!window.THREE) {
        const msg = document.getElementById('msg');
        const msgText = document.getElementById('msgText');
        if (msg && msgText) {
          msgText.innerText = 'LOAD ERROR';
          msg.style.display = 'block';
        }
        console.error('Three.js failed to load. Game initialization stopped safely.');
        return;
      }

      const $ = (id) => document.getElementById(id);
      const safeOn = (el, type, handler, options) => {
        if (!el || !el.addEventListener) return;
        el.addEventListener(type, handler, options);
      };

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);
      const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 80);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      // Fixed renderer pixel ratio keeps WebGL line strokes visually consistent across levels.
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);

      const clock = new THREE.Clock();
      const strokeMat = new THREE.LineBasicMaterial({ color: 0x000000, depthTest: false, depthWrite: false });
      const softStrokeMat = new THREE.LineBasicMaterial({ color: 0x777777, transparent: true, opacity: 0.45, depthTest: false, depthWrite: false });
      const keys = {};

      const GRAVITY = -0.032;
      const JUMP_SPEED = 0.62;
      const MOVE_SPEED = 0.14;
      const ATTACK_TOTAL_FRAMES = 8;
      const ATTACK_COOLDOWN_FRAMES = 8;
      const ATTACK_STRIKE_START = 7;
      const ATTACK_STRIKE_END = 4;

      let currentLevelIndex = 0;
      let hp = 5, wallet = 50, gameOver = false, introActive = true, levelBannerActive = false;
      let onGround = true, facingDir = 1, playerState = 'idle', animTime = 0, stateFrame = 0;
      let attackTimer = 0, attackCooldown = 0, damageCooldown = 0, cameraShake = 0;
      let attackSoundPlayed = false;
      let attackVisualAimDy = 0;
      let stepTick = 0;
      let footstepSide = 0;
      let lastFootstepFrame = -999;
      const maxHp = 5;
      // Visual scale: keeps all stick characters proportionally shorter than door height.
      const CHAR_SCALE = 0.72;
      const DESKTOP_CAMERA_DISTANCE = 11.2;
      const DEFAULT_CAMERA_DISTANCE = 14;
      const PORTRAIT_TOUCH_CAMERA_DISTANCE = 28;
      const UNIFORM_STROKE_WIDTH = 0.034;
      const UNIFORM_SOFT_STROKE_WIDTH = 0.026;

      function isDesktopViewport() {
        return window.matchMedia && window.matchMedia('(min-width: 901px) and (pointer: fine)').matches;
      }

      function isTouchViewport() {
        return window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      }

      function isPortraitViewport() {
        return innerHeight > innerWidth;
      }

      function getCameraProfile() {
        if (isDesktopViewport()) {
          return { name: 'desktop', defaultDistance: DESKTOP_CAMERA_DISTANCE, minDistance: 7.5, maxDistance: 18 };
        }
        if (isTouchViewport() && isPortraitViewport()) {
          return { name: 'touchPortrait', defaultDistance: PORTRAIT_TOUCH_CAMERA_DISTANCE, minDistance: 18, maxDistance: 46 };
        }
        return { name: 'touchLandscape', defaultDistance: DEFAULT_CAMERA_DISTANCE, minDistance: 6.5, maxDistance: 22 };
      }

      function getDefaultCameraDistance() {
        return getCameraProfile().defaultDistance;
      }

      let fpsFrames = 0, fpsTime = 0, currentFPS = 60, lowPerfMode = false;

      const playerGroup = new THREE.Group();
      const stickParts = new THREE.Group();
      stickParts.scale.set(CHAR_SCALE, CHAR_SCALE, CHAR_SCALE);
      playerGroup.add(stickParts);
      scene.add(playerGroup);
      const playerVelocity = new THREE.Vector3();


      const orbit = {
        yaw: 0,
        pitch: 0,
        height: 1.35,
        distance: getDefaultCameraDistance(),
        dragging: false,
        pointerId: null,
        lastX: 0,
        lastY: 0,
        pinching: false,
        pinchStartDistance: 0,
        pinchStartCameraDistance: getDefaultCameraDistance(),
        pinchLastCenter: { x: 0, y: 0 },
        panX: 0,
        panY: 0,
        pointers: new Map()
      };
      let currentCameraProfileName = getCameraProfile().name;

      function clampCameraDistance(v) {
        const profile = getCameraProfile();
        return Math.max(profile.minDistance, Math.min(profile.maxDistance, v));
      }

      function getPinchDistance() {
        const pts = Array.from(orbit.pointers.values());
        if (pts.length < 2) return 0;
        const dx = pts[0].x - pts[1].x;
        const dy = pts[0].y - pts[1].y;
        return Math.hypot(dx, dy);
      }

      function getPinchCenter() {
        const pts = Array.from(orbit.pointers.values());
        if (pts.length < 2) return { x: 0, y: 0 };
        return {
          x: (pts[0].x + pts[1].x) * 0.5,
          y: (pts[0].y + pts[1].y) * 0.5
        };
      }

      function clampCameraPan() {
        orbit.panX = Math.max(-3.5, Math.min(3.5, orbit.panX));
        orbit.panY = Math.max(-2.2, Math.min(2.2, orbit.panY));
      }

      function setupOrbitInput() {
        renderer.domElement.addEventListener('pointerdown', e => {
          if (introActive || gameOver) return;
          e.preventDefault();
          orbit.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
          renderer.domElement.setPointerCapture?.(e.pointerId);

          if (orbit.pointers.size >= 2) {
            orbit.dragging = false;
            orbit.pointerId = null;
            orbit.pinching = true;
            orbit.pinchStartDistance = Math.max(1, getPinchDistance());
            orbit.pinchStartCameraDistance = orbit.distance;
            orbit.pinchLastCenter = getPinchCenter();
            return;
          }

          orbit.pinching = false;
          orbit.dragging = true;
          orbit.pointerId = e.pointerId;
          orbit.lastX = e.clientX;
          orbit.lastY = e.clientY;
        });

        renderer.domElement.addEventListener('pointermove', e => {
          if (introActive || gameOver) return;
          if (!orbit.pointers.has(e.pointerId)) return;
          e.preventDefault();
          orbit.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

          if (orbit.pinching && orbit.pointers.size >= 2) {
            const currentPinchDistance = Math.max(1, getPinchDistance());
            const zoomRatio = orbit.pinchStartDistance / currentPinchDistance;
            const center = getPinchCenter();
            const centerDx = center.x - orbit.pinchLastCenter.x;
            const centerDy = center.y - orbit.pinchLastCenter.y;
            const panScale = orbit.distance * 0.0018;
            orbit.panX -= centerDx * panScale;
            orbit.panY += centerDy * panScale;
            clampCameraPan();
            orbit.pinchLastCenter = center;
            orbit.distance = clampCameraDistance(orbit.pinchStartCameraDistance * zoomRatio);
            return;
          }

          if (!orbit.dragging || e.pointerId !== orbit.pointerId) return;
          const dx = e.clientX - orbit.lastX;
          const dy = e.clientY - orbit.lastY;
          orbit.lastX = e.clientX;
          orbit.lastY = e.clientY;
          const orbitYawLimit = 1.17; // wider left/right orbit while keeping side-scroller readability
          const orbitPitchLimit = 0.92; // real forward/back tilt in Z-depth, controlled by vertical drag
          orbit.yaw = Math.max(-orbitYawLimit, Math.min(orbitYawLimit, orbit.yaw + dx * 0.004));
          orbit.pitch = Math.max(-orbitPitchLimit, Math.min(orbitPitchLimit, orbit.pitch - dy * 0.0065));
        });

        const endOrbitDrag = e => {
          orbit.pointers.delete(e.pointerId);
          renderer.domElement.releasePointerCapture?.(e.pointerId);

          if (orbit.pinching && orbit.pointers.size < 2) {
            orbit.pinching = false;
            orbit.pinchStartDistance = 0;
            orbit.pinchStartCameraDistance = orbit.distance;
          }

          if (e.pointerId === orbit.pointerId || orbit.pointers.size === 0) {
            orbit.dragging = false;
            orbit.pointerId = null;
          }

          if (orbit.pointers.size === 1) {
            const [nextId, pt] = Array.from(orbit.pointers.entries())[0];
            orbit.dragging = true;
            orbit.pointerId = nextId;
            orbit.lastX = pt.x;
            orbit.lastY = pt.y;
          }
        };

        renderer.domElement.addEventListener('pointerup', endOrbitDrag);
        renderer.domElement.addEventListener('pointercancel', endOrbitDrag);
        renderer.domElement.addEventListener('pointerleave', endOrbitDrag);
        renderer.domElement.addEventListener('wheel', e => {
          if (introActive || gameOver) return;
          e.preventDefault();
          orbit.distance = clampCameraDistance(orbit.distance + e.deltaY * 0.01);
        }, { passive: false });

      function unlockAudio() {

      function tone(freq = 440, dur = 0.12, type = 'square', gain = 0.3, slide = 0) {
        if (!ensureAudioRunning()) return;
        const t = audio.ctx.currentTime;
        const osc = audio.ctx.createOscillator();
        const g = audio.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g); g.connect(audio.master);
        osc.start(t); osc.stop(t + dur + 0.02);
      }

      function noise(dur = 0.12, gain = 0.2, filter = 800, type = 'bandpass') {
        if (!ensureAudioRunning() || !audio.noiseBuffer) return;
        const t = audio.ctx.currentTime;
        const src = audio.ctx.createBufferSource();
        const f = audio.ctx.createBiquadFilter();
        const g = audio.ctx.createGain();
        src.buffer = audio.noiseBuffer;
        const offset = Math.random() * Math.max(0.001, audio.noiseBuffer.duration - dur);
        f.type = type; f.frequency.value = filter; f.Q.value = 1.4;
        g.gain.setValueAtTime(gain, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(f); f.connect(g); g.connect(audio.master);
        src.start(t, Math.max(0, offset)); src.stop(t + dur + 0.02);
      }

      function disposeObjectTree(obj) {
        if (!obj) return;
        if (obj.children && obj.children.length) {
          while (obj.children.length) disposeObjectTree(obj.children.pop());
        }
        if (obj.parent) obj.parent.remove(obj);
        if (obj.geometry && obj.geometry.dispose) obj.geometry.dispose();
        if (obj.material && obj.material.map && obj.material.map.dispose) obj.material.map.dispose();
        if (obj.material && obj.material.dispose && obj.material !== strokeMat && obj.material !== softStrokeMat) obj.material.dispose();
      }

      function clearGroup(group) {
        while (group.children.length) disposeObjectTree(group.children.pop());
      }


      function getStrokeStyle(mat) {
        const isSoft = mat === softStrokeMat;
        const color = mat && mat.color ? mat.color.getHex() : 0x000000;
        const opacity = mat && mat.transparent ? (Number.isFinite(mat.opacity) ? mat.opacity : 0.45) : 1;
        return {
          width: isSoft ? UNIFORM_SOFT_STROKE_WIDTH : UNIFORM_STROKE_WIDTH,
          material: new THREE.MeshBasicMaterial({
            color,
            transparent: opacity < 1,
            opacity,
            depthTest: false,
            depthWrite: false,
            side: THREE.DoubleSide
          })
        };
      }

      function addStrokeSegment(parent, a, b, style) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const len = Math.hypot(dx, dy);
        if (len < 0.0001) return null;
        const geo = new THREE.PlaneGeometry(len, style.width);
        const mesh = new THREE.Mesh(geo, style.material.clone());
        mesh.position.set((a.x + b.x) * 0.5, (a.y + b.y) * 0.5, Math.max(a.z || 0, b.z || 0));
        mesh.rotation.z = Math.atan2(dy, dx);
        mesh.renderOrder = 10;
        parent.add(mesh);
        return mesh;
      }

      function addStrokeCap(parent, p, style) {
        const geo = new THREE.CircleGeometry(style.width * 0.5, 10);
        const cap = new THREE.Mesh(geo, style.material.clone());
        cap.position.set(p.x, p.y, p.z || 0);
        cap.renderOrder = 10;
        parent.add(cap);
        return cap;
      }

      function addSingleLine(group, pts, mat = strokeMat) {
        // Use thin mesh strokes instead of WebGL native lines.
        // Native THREE.Line/LineBasicMaterial renders inconsistently across browsers,
        // DPI settings, camera tilt, and adjacent stair segments. This keeps every
        // floor, tier, stair, character limb, ring, spike, and door stroke visually uniform.
        const strokeGroup = new THREE.Group();
        const style = getStrokeStyle(mat);
        let segments = 0;
        for (let i = 0; i < pts.length - 1; i++) {
          if (addStrokeSegment(strokeGroup, pts[i], pts[i + 1], style)) segments++;
        }
        if (segments > 0) {
          addStrokeCap(strokeGroup, pts[0], style);
          addStrokeCap(strokeGroup, pts[pts.length - 1], style);
        }
        // Dispose the un-cloned style material holder. Segment/cap meshes own clones.
        if (style.material && style.material.dispose) style.material.dispose();
        group.add(strokeGroup);
        return strokeGroup;
      }

      function addLineTo(group, pts, mat = strokeMat) {
        return addSingleLine(group, pts, mat);
      }

      function drawCircle(group, cx, cy, r, mat = strokeMat) {
        const pts = [];
        const segments = 32;
        for (let i = 0; i < segments; i++) {
          const a = i / segments * Math.PI * 2;
          pts.push(new THREE.Vector3(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 0));
        }
        pts.push(pts[0].clone());
        addLineTo(group, pts, mat);
      }

      function burst(x, y, count = 8) {
        const group = new THREE.Group();
        group.position.set(x, y, 0.03);
        for (let i = 0; i < count; i++) {
          const a = i / count * Math.PI * 2;
          addLineTo(group, [new THREE.Vector3(Math.cos(a) * 0.08, Math.sin(a) * 0.08, 0), new THREE.Vector3(Math.cos(a) * 0.42, Math.sin(a) * 0.42, 0)]);
        }
        fxGroup.add(group);
        fx.push({ group, life: 24 });
      }

      function makeTextSprite(text) {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 96;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.font = 'bold 32px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 128, 48);
        const tex = new THREE.CanvasTexture(c);
        tex.needsUpdate = true;
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
        const spr = new THREE.Sprite(mat);
        spr.scale.set(1.35, 0.5, 1);
        return spr;
      }

      function makeSpeechBubbleSprite(text, tailSide = 'left') {
        const c = document.createElement('canvas');
        c.width = 1024; c.height = 420;
        const ctx = c.getContext('2d');
        const cx = 512;
        const cy = 175;
        const rx = 430;
        const ry = 142;

        ctx.clearRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 5;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        // Oval-only speech bubble. No tail or rectangular body.
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '88px "StickBubble", "Comic Sans MS", cursive';
        wrapBubbleText(ctx, text, cx, cy + 2, 780, 92);

        const tex = new THREE.CanvasTexture(c);
        tex.needsUpdate = true;
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
        const spr = new THREE.Sprite(mat);
        spr.scale.set(5.65, 2.95, 1);
        return spr;
      }

      function wrapBubbleText(ctx, text, centerX, startY, maxWidth, lineHeight) {
        const words = text.split(' ');
        const lines = [];
        let line = '';
        for (let i = 0; i < words.length; i++) {
          const test = line ? line + ' ' + words[i] : words[i];
          if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = words[i];
          } else {
            line = test;
          }
        }
        if (line) lines.push(line);
        const offsetY = startY - ((lines.length - 1) * lineHeight) / 2;
        lines.forEach((ln, idx) => ctx.fillText(ln, centerX, offsetY + idx * lineHeight));
      }

      function spawnText(text, x, y) {
        const sprite = makeTextSprite(text);
        sprite.position.set(x, y, 0.1);
        fxGroup.add(sprite);
        fx.push({ sprite, life: 58, kind: 'text' });
      }

      function spawnSpeechBubble(text, x, y, tailSide = 'left') {
        const sprite = makeSpeechBubbleSprite(text, tailSide);
        sprite.position.set(x, y, 0.16);
        sprite.scale.multiplyScalar(1.08);
        fxGroup.add(sprite);
        fx.push({ sprite, life: 84, maxLife: 84, kind: 'bubble' });
      }

      function updateFX() {
        for (let i = fx.length - 1; i >= 0; i--) {
          const item = fx[i];
          item.life--;
          if (item.sprite) {
            if (item.kind === 'bubble') {
              const maxLife = item.maxLife || 84;
              const age = maxLife - item.life;
              const pop = Math.min(1, 0.78 + age * 0.03);
              item.sprite.scale.set(5.65 * 1.08 * Math.min(pop, 1.05), 2.95 * 1.08 * Math.min(pop, 1.05), 1);
              item.sprite.position.y += 0.011;
              item.sprite.position.x += 0.0025;
              item.sprite.material.opacity = item.life > 18 ? 1 : Math.max(0, item.life / 18);
            } else {
              item.sprite.position.y += 0.025;
              item.sprite.material.opacity = Math.max(0, item.life / 58);
            }
            if (item.life <= 0) {
              fxGroup.remove(item.sprite);
              item.sprite.material.map.dispose();
              item.sprite.material.dispose();
              fx.splice(i, 1);
            }
          } else if (item.group) {
            item.group.scale.multiplyScalar(1.025);
            if (item.life < 10 && !lowPerfMode) item.group.children.forEach(line => line.material = softStrokeMat);
            if (item.life <= 0) {
              clearGroup(item.group);
              fxGroup.remove(item.group);
              fx.splice(i, 1);
            }
          }
        }
      }

      function poseFor(state, frame, facing) {
        const s = facing;
        const run = frame * 0.45;
        const sin = Math.sin(run);
        const cos = Math.cos(run);
        const p = {
          head: [0, 1.62], neck: [0, 1.43], hip: [0, 0.86],
          a1: [-0.22 * s, 1.18], h1: [-0.38 * s, 0.96], a2: [0.22 * s, 1.18], h2: [0.38 * s, 0.96],
          k1: [-0.2 * s, 0.48], f1: [-0.32 * s, 0], k2: [0.2 * s, 0.48], f2: [0.32 * s, 0],
          sword: [0.68 * s, 0.78], sheathedSword: true, smear: false
        };
        if (state === 'run') {
          p.head = [0.05 * s, 1.58 + Math.abs(sin) * 0.04];
          p.neck = [0.03 * s, 1.40 + Math.abs(sin) * 0.03];
          p.hip = [0, 0.84 + Math.abs(sin) * 0.02];
          p.a1 = [-0.28 * sin * s, 1.18 + cos * 0.06]; p.h1 = [-0.46 * sin * s, 0.95 + cos * 0.07];
          p.a2 = [0.28 * sin * s, 1.18 - cos * 0.06]; p.h2 = [0.46 * sin * s, 0.95 - cos * 0.07];
          p.k1 = [0.28 * sin * s, 0.48]; p.f1 = [0.52 * sin * s, Math.max(0, 0.06 * cos)];
          p.k2 = [-0.28 * sin * s, 0.48]; p.f2 = [-0.52 * sin * s, Math.max(0, -0.06 * cos)];
          if (Math.abs(p.f1[1]) < 0.005) p.f1[1] = 0;
          if (Math.abs(p.f2[1]) < 0.005) p.f2[1] = 0;
          p.sword = [0.70 * s, 0.76];
        }
        if (state === 'jump' || state === 'fall') {
          p.head = [0.03 * s, state === 'jump' ? 1.72 : 1.54];
          p.neck = [0.02 * s, state === 'jump' ? 1.52 : 1.36];
          p.hip = [0, 0.88];
          p.a1 = [0.35 * s, 1.50]; p.h1 = [0.47 * s, state === 'jump' ? 1.76 : 1.10];
          p.a2 = [-0.32 * s, 1.38]; p.h2 = [-0.45 * s, state === 'jump' ? 1.60 : 1.06];
          p.k1 = [0.18 * s, 0.50]; p.f1 = [0.22 * s, 0.16];
          p.k2 = [-0.18 * s, 0.48]; p.f2 = [-0.28 * s, 0.16];
          p.sword = [0.72 * s, 0.92];
        }
        if (state === 'block') {
          p.head = [-0.04 * s, 1.22]; p.neck = [-0.03 * s, 1.05]; p.hip = [0, 0.66];
          p.a1 = [0.25 * s, 1.02]; p.h1 = [0.55 * s, 1.13]; p.a2 = [-0.22 * s, 0.95]; p.h2 = [0.22 * s, 0.90];
          p.k1 = [0.28 * s, 0.40]; p.f1 = [0.55 * s, 0]; p.k2 = [-0.25 * s, 0.40]; p.f2 = [-0.48 * s, 0];
          p.sword = [0.86 * s, 1.10];
          p.sheathedSword = false;
        }
        if (state === 'attack') {
          const strike = attackTimer <= ATTACK_STRIKE_START && attackTimer >= ATTACK_STRIKE_END;
          const aimDy = strike ? Math.max(-0.75, Math.min(1.05, attackVisualAimDy)) : 0;
          const handAimY = aimDy * 0.48;
          const swordAimY = aimDy * 0.74;
          p.head = [0.08 * s, 1.56]; p.neck = [0.05 * s, 1.38]; p.hip = [-0.02 * s, 0.84];
          p.a1 = strike ? [0.36 * s, 1.30 + handAimY * 0.35] : [-0.32 * s, 1.45];
          p.h1 = strike ? [0.62 * s, 1.08 + handAimY] : [-0.48 * s, 1.58];
          p.sword = strike ? [1.38 * s, 0.90 + swordAimY] : [-0.9 * s, 1.80];
          p.sheathedSword = false;
          p.smear = strike && !lowPerfMode;
          p.smearEnd = strike ? [1.20 * s, 1.22 + swordAimY * 0.82] : null;
          p.k1 = [0.34 * s, 0.48]; p.f1 = [0.60 * s, 0]; p.k2 = [-0.18 * s, 0.48]; p.f2 = [-0.35 * s, 0];
        }
        if (state === 'hit') {
          p.head = [-0.18 * s, 1.50]; p.neck = [-0.12 * s, 1.30]; p.hip = [0.02 * s, 0.80];
          p.a1 = [-0.38 * s, 1.18]; p.h1 = [-0.58 * s, 0.98];
          p.sword = [0.60 * s, 0.78];
        }
        return p;
      }

      function drawStickman() {

      function createPlatform(x1, y, x2) {
        // One visible pencil line, one rigid hidden collider.
        // Do not draw any duplicate strokes or thickness rectangles.
        const a = Math.min(x1, x2);
        const b = Math.max(x1, x2);
        if (Math.abs(b - a) < 0.08) return null;
        const line = addLineTo(scene, [new THREE.Vector3(a, y, 0.02), new THREE.Vector3(b, y, 0.02)], strokeMat);
        platforms.push({ x1: a, x2: b, y, line, rigid: true });
        return line;
      }


      function createStaircase(x, y, steps, stepW, stepH, direction = 1) {
        const cleanSteps = Math.max(2, Math.round(steps || 2));
        const dir = direction >= 0 ? 1 : -1;
        const startX = x;
        const startY = y;
        const endX = x + dir * cleanSteps * stepW;
        const endY = y + cleanSteps * stepH;
        const minX = Math.min(startX, endX);
        const maxX = Math.max(startX, endX);

        // One hidden continuous ramp collider per staircase.
        // The visible stair remains one pencil polyline. The collision stays rigid
        // across the whole stair span, so no level can have fall-through stair gaps.
        stairs.push({
          x1: minX,
          x2: maxX,
          startX,
          startY,
          endX,
          endY,
          y1: startY,
          y2: endY,
          direction: dir,
          stepW,
          stepH,
          steps: cleanSteps,
          rigid: true
        });

        // Visible stair drawing: one continuous pencil polyline only.
        const pts = [new THREE.Vector3(startX, startY, 0.02)];
        for (let i = 0; i < cleanSteps; i++) {
          const nx = startX + dir * (i + 1) * stepW;
          const sy = startY + i * stepH;
          const ny = startY + (i + 1) * stepH;
          pts.push(new THREE.Vector3(nx, sy, 0.02));
          pts.push(new THREE.Vector3(nx, ny, 0.02));
        }
        const stairLine = addLineTo(scene, pts, strokeMat);
        levelDecor.push(stairLine);
        return stairLine;
      }

      function enemyGroundAt(x, referenceY) {
        let best = null;
        let bestDelta = Infinity;
        for (const p of platforms) {
          const a = Math.min(p.x1, p.x2);
          const b = Math.max(p.x1, p.x2);
          const onPlatform = x >= a + 0.10 && x <= b - 0.10;
          if (!onPlatform) continue;
          const delta = Math.abs(p.y - referenceY);
          if (delta < bestDelta && delta < 1.8) {
            best = { x1: a, x2: b, y: p.y };
            bestDelta = delta;
          }
        }
        for (const stair of stairs) {
          const minX = Math.min(stair.x1, stair.x2);
          const maxX = Math.max(stair.x1, stair.x2);
          if (x < minX + 0.10 || x > maxX - 0.10) continue;
          const sy = stairYAt(stair, x);
          const delta = Math.abs(sy - referenceY);
          if (delta < bestDelta && delta < 1.8) {
            best = { x1: minX, x2: maxX, y: sy, isStair: true };
            bestDelta = delta;
          }
        }
        return best;
      }

      function updateDynamicObstacles(frameScale) {
        const px = playerGroup.position.x;
        const py = playerGroup.position.y;

        for (const b of boulders) {
          if (b.state === 'idle' && Math.abs(px - b.triggerX) < 0.55 && Math.abs(py - b.groundY) < 0.65) {
            b.state = 'warning';
            b.timer = 48;
            b.shadow.visible = true;
            b.rock.visible = true;
            b.rock.position.y = b.topY;
            b.y = b.topY;
            playSfx('enemyAttack');
          }
          if (b.state === 'warning') {
            b.timer -= frameScale;
            const pulse = 1 + Math.sin(animTime * 0.42) * 0.18;
            b.shadow.scale.set(pulse, pulse, 1);
            if (b.timer <= 0) b.state = 'drop';
          } else if (b.state === 'drop') {
            b.y -= 0.26 * frameScale;
            b.rock.position.y = b.y;
            if (!b.hit && Math.abs(px - b.dropX) < 0.62 && Math.abs((py + 0.75) - b.y) < 0.82) {
              b.hit = true;
              playerVelocity.x = px < b.dropX ? -0.18 : 0.18;
              playerVelocity.y = 0.20;
              applyDamage(1, 'CRUSHED!');
            }
            if (b.y <= b.groundY + 0.48) {
              b.y = b.groundY + 0.48;
              b.rock.position.y = b.y;
              b.state = 'landed';
              b.timer = 70;
              cameraShake = Math.max(cameraShake, 0.08);
              burst(b.dropX, b.groundY + 0.45, 8);
            }
          } else if (b.state === 'landed') {
            b.timer -= frameScale;
            if (b.timer <= 0) {
              b.state = 'idle';
              b.hit = false;
              b.shadow.visible = false;
              b.rock.visible = false;
              b.rock.position.y = b.topY;
            }
          }
        }

        for (const a of swingingAxes) {
          const angle = Math.sin(animTime * a.speed + a.phase) * a.amplitude;
          a.arm.rotation.z = angle;
          const bladeX = a.anchorX + Math.sin(angle) * a.length;
          const bladeY = a.anchorY - Math.cos(angle) * a.length;
          const pulse = 1 + Math.abs(Math.sin(animTime * 0.12 + a.phase)) * 0.16;
          a.warn.scale.set(pulse, pulse, 1);
          if (Math.abs(px - bladeX) < 0.62 && Math.abs((py + 0.75) - bladeY) < 0.62) {
            playerVelocity.x = px < bladeX ? -0.14 : 0.14;
            applyDamage(1, 'AXED!');
          }
        }

        for (const s of sawBlades) {
          s.t += s.speed * frameScale;
          const u = (Math.sin(s.t) + 1) * 0.5;
          s.x = s.minX + (s.maxX - s.minX) * u;
          s.saw.position.x = s.x;
          s.saw.position.y = s.y;
          s.saw.rotation.z -= 0.22 * frameScale;
          const pulse = 1 + Math.abs(Math.sin(animTime * 0.16)) * 0.10;
          s.warn.scale.set(pulse, pulse, 1);
          if (Math.abs(px - s.x) < 0.62 && Math.abs((py + 0.55) - s.y) < 0.62) {
            playerVelocity.x = px < s.x ? -0.24 : 0.24;
            playerVelocity.y = Math.max(playerVelocity.y, 0.14);
            applyDamage(1, 'SAWED!');
          }
        }


        for (const l of rollingLogs) {
          l.x += l.speed * l.dir * frameScale;
          if (l.x <= l.minX) { l.x = l.minX; l.dir = 1; }
          if (l.x >= l.maxX) { l.x = l.maxX; l.dir = -1; }
          l.log.position.x = l.x;
          l.log.rotation.z -= 0.15 * l.dir * frameScale;
          const pulse = 1 + Math.abs(Math.sin(animTime * 0.13)) * 0.10;
          l.warn.scale.set(pulse, pulse, 1);
          if (Math.abs(px - l.x) < 0.72 && Math.abs((py + 0.55) - l.y) < 0.72) {
            playerVelocity.x = px < l.x ? -0.26 : 0.26;
            playerVelocity.y = Math.max(playerVelocity.y, 0.16);
            applyDamage(1, 'LOGGED!');
          }
        }

        for (const c of crushingWalls) {
          c.cycle = (c.cycle + frameScale) % 300;
          const closing = c.cycle >= 210 && c.cycle < 240;
          const closed = c.cycle >= 240;
          const opening = c.cycle < 30;
          let t = 0;
          if (closing) t = (c.cycle - 210) / 30;
          else if (closed) t = 1;
          else if (opening) t = 1 - (c.cycle / 30);
          const openOffset = c.openGap * 0.5;
          const closedOffset = c.blockW * 0.55;
          const offset = openOffset + (closedOffset - openOffset) * Math.max(0, Math.min(1, t));
          c.left.position.set(c.centerX - offset, c.y, 0.08);
          c.right.position.set(c.centerX + offset, c.y, 0.08);
          c.warn.visible = c.cycle >= 170 || closed;
          const pulse = 1 + Math.abs(Math.sin(animTime * 0.22)) * 0.20;
          c.warn.scale.set(pulse, pulse, 1);
          const bodyY = py + 0.75;
          const withinY = bodyY > c.y - 0.15 && bodyY < c.y + c.blockH + 0.15;
          const hitLeft = Math.abs(px - (c.centerX - offset)) < c.blockW * 0.72 && withinY;
          const hitRight = Math.abs(px - (c.centerX + offset)) < c.blockW * 0.72 && withinY;
          if ((hitLeft || hitRight) && t > 0.55) {

          w.waves.forEach((wave, idx) => {
            const travel = ((phase + idx * 0.55) % 3.8 + 3.8) % 3.8;
            wave.position.x = w.dir > 0 ? travel : -travel;
            wave.position.y = Math.sin(animTime * 0.08 + idx) * 0.05;
          });
          w.warn.rotation.z = w.dir > 0 ? 0 : Math.PI;
          w.warn.scale.set(1 + Math.abs(Math.sin(animTime * 0.11)) * 0.16, 1, 1);

              t.projectiles.splice(i, 1);

          }
        }

      function drawEnemy(e) {
        if (lowPerfMode && e.frame % 2 !== 0 && e.state === 'idle') return;
        clearGroup(e.group);
        if (e.dead) return;
        const f = e.group.scale.x >= 0 ? 1 : -1;
        const walk = e.state === 'walk' ? Math.sin(animTime * 0.14) : 0;
        const death = e.state === 'death' ? Math.min(1, e.frame / 24) : 0;
        const t = e.attackTimer;
        const punchActive = e.state === 'attack' && e.attackType === 'punch' && t <= 24 && t >= 11;
        const kickActive = e.state === 'attack' && e.attackType === 'kick' && t <= 24 && t >= 10;
        const windup = e.state === 'attack' && t > 24;
        const headY = 1.34 - death * 0.55;
        const hipY = 0.72 - death * 0.28;

        drawCircle(e.group, 0, headY, 0.14);
        addLineTo(e.group, [new THREE.Vector3(0, headY - 0.15, 0), new THREE.Vector3(0.04 * death * f, hipY, 0)]);

        if (punchActive) {
          addLineTo(e.group, [new THREE.Vector3(0, headY - 0.28, 0), new THREE.Vector3(0.32 * f, 1.13, 0), new THREE.Vector3(0.72 * f, 1.02, 0)]);
          addLineTo(e.group, [new THREE.Vector3(0, headY - 0.28, 0), new THREE.Vector3(-0.22 * f, 1.08, 0), new THREE.Vector3(-0.38 * f, 0.94, 0)]);
          if (!lowPerfMode) addLineTo(e.group, [new THREE.Vector3(0.40 * f, 1.08, 0), new THREE.Vector3(0.92 * f, 1.00, 0)], softStrokeMat);
        } else if (windup) {
          addLineTo(e.group, [new THREE.Vector3(0, headY - 0.28, 0), new THREE.Vector3(-0.28 * f, 1.18, 0), new THREE.Vector3(-0.54 * f, 1.30, 0)]);
          addLineTo(e.group, [new THREE.Vector3(0, headY - 0.28, 0), new THREE.Vector3(0.22 * f, 1.05, 0), new THREE.Vector3(0.36 * f, 0.90, 0)]);
        } else {
          addLineTo(e.group, [new THREE.Vector3(0, headY - 0.28, 0), new THREE.Vector3((0.22 + walk * 0.08) * f, 1.05 - death * 0.2, 0), new THREE.Vector3((0.38 + walk * 0.12) * f, 0.88 - death * 0.3, 0)]);
          addLineTo(e.group, [new THREE.Vector3(0, headY - 0.28, 0), new THREE.Vector3((-0.22 - walk * 0.08) * f, 1.05, 0), new THREE.Vector3((-0.34 - walk * 0.12) * f, 0.88, 0)]);
        }

        if (kickActive) {
          addLineTo(e.group, [new THREE.Vector3(0.04 * death * f, hipY, 0), new THREE.Vector3(0.36 * f, 0.58, 0), new THREE.Vector3(0.86 * f, 0.58, 0)]);
          addLineTo(e.group, [new THREE.Vector3(0.04 * death * f, hipY, 0), new THREE.Vector3(-0.20 * f, 0.38, 0), new THREE.Vector3(-0.38 * f, 0, 0)]);
          if (!lowPerfMode) addLineTo(e.group, [new THREE.Vector3(0.58 * f, 0.63, 0), new THREE.Vector3(1.02 * f, 0.63, 0)], softStrokeMat);
        } else {

        }

      function feetY() { return playerGroup.position.y; }
      function snapPlayerToGround(x = -7, groundY = 0) {
        playerGroup.position.set(x, groundY, 0);
        playerVelocity.set(0, 0, 0);
        onGround = true;
      }
      function stairYAt(stair, x) {
        // Interpolate along the actual authored stair direction.
        // This works for every level and for both ascending-right and ascending-left stairs.
        const startX = Number.isFinite(stair.startX) ? stair.startX : stair.x1;
        const endX = Number.isFinite(stair.endX) ? stair.endX : stair.x2;
        const startY = Number.isFinite(stair.startY) ? stair.startY : stair.y1;
        const endY = Number.isFinite(stair.endY) ? stair.endY : stair.y2;
        const denom = Math.abs(endX - startX) < 0.001 ? 1 : (endX - startX);
        const t = Math.max(0, Math.min(1, (x - startX) / denom));
        return startY + (endY - startY) * t;
      }

      function platformAt(x, y, prevY) {
        let best = null;
        let bestDelta = Infinity;

        const platformEdgeTol = 0.28;
        const platformTol = 0.40;
        const stairEdgeTol = 0.46;
        const stairTol = 1.05;

        // Stairs are continuous hidden ramps under one visible pencil stair line.
        // They are checked first so the player snaps to the stair instead of dropping
        // between visual steps or before/after a stair endpoint.
        for (const stair of stairs) {
          const minX = Math.min(stair.x1, stair.x2);
          const maxX = Math.max(stair.x1, stair.x2);
          if (x < minX - stairEdgeTol || x > maxX + stairEdgeTol) continue;

          const sy = stairYAt(stair, x);
          const delta = Math.abs(y - sy);
          const wasNearStair = Math.abs(prevY - sy) <= stairTol;
          const crossedDown = prevY >= sy - 0.18 && y <= sy + stairTol;
          const groundedStep = onGround && delta <= stairTol;
          const fallingOntoRamp = playerVelocity.y <= 0.32 && (crossedDown || wasNearStair || delta <= stairTol);

          if ((groundedStep || fallingOntoRamp) && delta < bestDelta) {
            best = { x1: minX, x2: maxX, y: sy, isStair: true, rigid: true, source: stair };
            bestDelta = delta;
          }
        }

        // Platform/tier/floor collision: each visible line is a rigid walkable segment.
        // Gaps stay empty because collision is limited to explicit platform segments.
        for (const p of platforms) {
          const a = Math.min(p.x1, p.x2);
          const b = Math.max(p.x1, p.x2);
          if (x < a - platformEdgeTol || x > b + platformEdgeTol) continue;

          const delta = Math.abs(y - p.y);
          const crossed = prevY >= p.y - 0.14 && y <= p.y + platformTol;
          const close = delta <= platformTol;
          if (playerVelocity.y <= 0.32 && (crossed || close) && delta < bestDelta) {
            best = { x1: a, x2: b, y: p.y, rigid: true, source: p };
            bestDelta = delta;
          }
        }
        return best;
      }
      function resolveGround(prevY) {
        const wasGrounded = onGround;
        onGround = false;
        const p = platformAt(playerGroup.position.x, feetY(), prevY);
        if (p) {
          playerGroup.position.y = p.y;
          if (!wasGrounded && Math.abs(playerVelocity.y) > 0.08) playSfx('land');
          playerVelocity.y = 0;
          onGround = true;
        }
      }

      function setPlayerState(s, force = false) {

      }

      function updatePlayer(frameScale) {
        if (levelBannerActive) {
          clearGameplayInputs();
          playerVelocity.x = 0;
          playerVelocity.y = 0;
          attackTimer = 0;
          attackCooldown = 0;
          attackSoundPlayed = false;
          damageCooldown = Math.max(0, damageCooldown - 1);
          setPlayerState('idle');
          return;
        }
        const prevY = feetY();
        let move = 0;
        if (keys.ArrowLeft) { move = -1; facingDir = -1; }
        if (keys.ArrowRight) { move = 1; facingDir = 1; }
        playerVelocity.x = move * MOVE_SPEED;
        if (keys.ArrowDown && onGround) playerVelocity.x *= 0.35;
        if (keys.ArrowUp && onGround && attackTimer <= 0) { playerVelocity.y = JUMP_SPEED; onGround = false; playSfx('jump'); setPlayerState('jump', true); }
        if (keys[' '] && attackCooldown <= 0) {
          attackTimer = ATTACK_TOTAL_FRAMES;
          attackCooldown = ATTACK_COOLDOWN_FRAMES;
          attackSoundPlayed = false;
          setPlayerState('attack', true);
        }
        if (attackTimer > 0) attackTimer--; else if (playerState === 'attack') setPlayerState(onGround ? 'idle' : 'fall', true);
        attackCooldown = Math.max(0, attackCooldown - 1);
        damageCooldown = Math.max(0, damageCooldown - 1);
        playerVelocity.y += GRAVITY * frameScale;
        playerGroup.position.x += playerVelocity.x * frameScale;
        playerGroup.position.y += playerVelocity.y * frameScale;
        resolveGround(prevY);
        if (feetY() < -6) { restartCurrentLevelAfterFall(); return; }
        if (damageCooldown > 0) setPlayerState('hit');
        else if (attackTimer > 0) setPlayerState('attack');
        else if (!onGround && playerVelocity.y > 0) setPlayerState('jump');
        else if (!onGround) setPlayerState('fall');
        else if (keys.ArrowDown) setPlayerState('block');
        else if (Math.abs(playerVelocity.x) > 0.01) {
          setPlayerState('run');
          stepTick += frameScale;
          const stepInterval = keys.ArrowDown ? 22 : 13;
          if (onGround && stepTick - lastFootstepFrame >= stepInterval) {
            lastFootstepFrame = stepTick;
            footstepSide = 1 - footstepSide;
            playSfx(footstepSide ? 'footstepLeft' : 'footstepRight');
          }
        } else {
          stepTick = 0;
          lastFootstepFrame = -999;
          setPlayerState('idle');
        }
      }

        for (const s of spikes) if (x > s.x - 0.2 && x < s.x + s.w + 0.2 && y < s.y + 0.18 && y > s.y - 0.06) applyDamage(1, 'SPIKED!');
      }
      function checkPotions() {

        for (const p of potions) if (!p.collected && Math.abs(x - p.x) < 0.55 && Math.abs(y - p.y) < 0.8) {
          p.collected = true; playSfx('collectWin'); scene.remove(p.group); hp = Math.min(maxHp, hp + 1); wallet += 5; burst(p.x, p.y + 0.6, 10); spawnText('+5 AED', p.x, p.y + 1.0); updateUI();

      }
      function checkDoors() {
        const x = playerGroup.position.x, y = feetY();
        for (const d of doors) {
          if (d.isExit && Math.abs(x - d.x) < 0.55 && Math.abs(y - d.y) < 1.0) {
            if (currentLevelIndex < LEVELS.length - 1) {
              currentLevelIndex++;
              loadCurrentLevel(false);
            } else {
              endGame('VICTORY!');
            }
            break;
          }
        }
      }
      function findAttackSurfaceAt(x, y, tolerance = 0.72) {
        let best = null;
        let bestDelta = Infinity;

        for (const p of platforms) {
          const a = Math.min(p.x1, p.x2);
          const b = Math.max(p.x1, p.x2);
          if (x < a - 0.18 || x > b + 0.18) continue;
          const delta = Math.abs(y - p.y);
          if (delta <= tolerance && delta < bestDelta) {
            best = { type: 'platform', x1: a, x2: b, y1: p.y, y2: p.y, source: p };
            bestDelta = delta;
          }
        }

        for (const stair of stairs) {
          const a = Math.min(stair.x1, stair.x2);
          const b = Math.max(stair.x1, stair.x2);
          if (x < a - 0.22 || x > b + 0.22) continue;
          const sy = stairYAt(stair, x);
          const delta = Math.abs(y - sy);
          if (delta <= tolerance && delta < bestDelta) {
            best = { type: 'stair', x1: a, x2: b, y1: Math.min(stair.startY, stair.endY), y2: Math.max(stair.startY, stair.endY), source: stair };
            bestDelta = delta;
          }
        }

        return best;
      }

      function surfacesOverlapInX(a, b, tolerance = 0.18) {
        if (!a || !b) return false;
        return Math.max(a.x1, b.x1) <= Math.min(a.x2, b.x2) + tolerance;
      }

      function stairConnectsAttackPath(playerSurface, enemySurface, playerX, enemyX) {
        if (!playerSurface || !enemySurface) return false;
        for (const stair of stairs) {
          const sx1 = Math.min(stair.x1, stair.x2);
          const sx2 = Math.max(stair.x1, stair.x2);
          const lowY = Math.min(stair.startY, stair.endY);
          const highY = Math.max(stair.startY, stair.endY);
          const yConnects = Math.abs(lowY - playerSurface.y1) <= 0.55 && Math.abs(highY - enemySurface.y1) <= 0.75;
          const reverseYConnects = Math.abs(highY - playerSurface.y1) <= 0.55 && Math.abs(lowY - enemySurface.y1) <= 0.75;
          const playerCanReachStair = playerX >= sx1 - 0.65 && playerX <= sx2 + 0.65;
          const enemyCanReachStair = enemyX >= sx1 - 0.65 && enemyX <= sx2 + 0.65;
          const stairTouchesBoth = surfacesOverlapInX(playerSurface, { x1: sx1, x2: sx2 }, 0.45) && surfacesOverlapInX(enemySurface, { x1: sx1, x2: sx2 }, 0.45);
          if ((yConnects || reverseYConnects) && (stairTouchesBoth || (playerCanReachStair && enemyCanReachStair))) return true;
        }
        return false;
      }

      function upwardAttackHasSolidConnection(enemy) {
        const playerFeetY = feetY();
        const playerX = playerGroup.position.x;
        const enemyX = enemy.x;
        const playerSurface = findAttackSurfaceAt(playerX, playerFeetY, onGround ? 0.78 : 1.55);
        const enemySurface = findAttackSurfaceAt(enemyX, enemy.y, 0.82);

        // Same-column shelves count as connected only when the current floor and
        // enemy floor overlap on the X axis. This prevents sword hits through an
        // empty horizontal gap while still allowing close vertical tier combat.
        if (playerSurface && enemySurface && surfacesOverlapInX(playerSurface, enemySurface, 0.22)) return true;

        // Stairs are authored as solid walkable ramps, so a stair connection keeps
        // upward attacks valid even when the player is standing on or beside the stair.
        if (stairConnectsAttackPath(playerSurface, enemySurface, playerX, enemyX)) return true;

        // If the player is airborne, allow upward hit only when both characters are
        // still inside the same visible solid X range. Do not allow cross-gap hits.
        if (!playerSurface && enemySurface && playerX >= enemySurface.x1 - 0.22 && playerX <= enemySurface.x2 + 0.22) return true;

        return false;
      }

      function updateAttackVisualAim() {
        attackVisualAimDy = 0;
        if (attackTimer < ATTACK_STRIKE_END || attackTimer > ATTACK_STRIKE_START) return;

        const reachX = playerGroup.position.x + facingDir * 0.82;
        const playerFeetY = feetY();
        const upwardAttackLimitY = playerFeetY + 2.2;
        let best = null;
        let bestScore = Infinity;

        for (const e of enemies) {
          if (e.dead || e.state === 'death') continue;

          const horizontalReach = Math.abs(reachX - e.x) < 1.05;
          if (!horizontalReach) continue;

          const sameLevelOrDownwardReach = e.y <= playerFeetY && Math.abs(playerFeetY - e.y) < 1.1;
          const sameLevelHighReach = e.y > playerFeetY && Math.abs(playerFeetY - e.y) < 1.1;
          const upwardReach = e.y > playerFeetY && e.y <= upwardAttackLimitY && upwardAttackHasSolidConnection(e);
          if (!(sameLevelOrDownwardReach || sameLevelHighReach || upwardReach)) continue;

          const verticalDelta = e.y - playerFeetY;
          const score = Math.abs(reachX - e.x) + Math.abs(verticalDelta) * 0.18;
          if (score < bestScore) {
            bestScore = score;
            best = verticalDelta;
          }
        }

        if (best === null || Math.abs(best) < 0.35) {
          attackVisualAimDy = 0;
        } else {
          attackVisualAimDy = best;
        }
      }

      function checkEnemyHit() {
        if (attackTimer < ATTACK_STRIKE_END || attackTimer > ATTACK_STRIKE_START) return;

        const reachX = playerGroup.position.x + facingDir * 0.82;
        const playerFeetY = feetY();
        const upwardAttackLimitY = playerFeetY + 2.2;
        let didHit = false;

        for (const e of enemies) {
          const horizontalReach = Math.abs(reachX - e.x) < 1.05;
          const sameLevelOrDownwardReach = e.y <= playerFeetY && Math.abs(playerFeetY - e.y) < 1.1;
          const sameLevelHighReach = e.y > playerFeetY && Math.abs(playerFeetY - e.y) < 1.1;
          const upwardReach = e.y > playerFeetY && e.y <= upwardAttackLimitY && upwardAttackHasSolidConnection(e);

          if (!e.dead && e.state !== 'death' && horizontalReach && (sameLevelOrDownwardReach || sameLevelHighReach || upwardReach)) {
            didHit = true;
            attackSoundPlayed = true;

            e.hp--;
            e.state = e.hp <= 0 ? 'death' : 'hit';
            e.frame = 0;
            attackTimer = 0;

            if (e.battleCryTimeout) {
              clearTimeout(e.battleCryTimeout);
              e.battleCryTimeout = null;
            }

            burst(e.x, e.y + 1.0, 9);

            if (e.hp <= 0) {
              playAssetSound('attackKill');
              if (!e.bubbleSpawned) {
                e.bubbleSpawned = true;
                e.pendingBubbleWord = enemyBubbleWords[Math.floor(Math.random() * enemyBubbleWords.length)];
              }
              delayed(() => {
                if (!gameOver) {
                  playSfx('coin');
                  wallet += 10;
                  spawnText('+10 AED', e.x, e.y + 1.25);
                  updateUI();
                }
              }, 120);
            } else {
              playAssetSound('attackHit');
            }

            break;
          }
        }

        if (!didHit && !attackSoundPlayed) {
          playAssetSound('attackAir');
          attackSoundPlayed = true;
        }
      }
      function updateEnemies() {
        for (const e of enemies) {
          if (e.dead) continue;
          e.frame++;

          if (e.state === 'death') {
            if (e.battleCryTimeout) { clearTimeout(e.battleCryTimeout); e.battleCryTimeout = null; }
            drawEnemy(e);
            if (e.frame > 30) {
              e.dead = true;
              scene.remove(e.group);
              if (e.pendingBubbleWord && !e.bubbleTimeout) {
                const bubbleWord = e.pendingBubbleWord;
                e.pendingBubbleWord = null;
                e.bubbleTimeout = delayed(() => {
                  e.bubbleTimeout = null;
                  if (!gameOver) {
                    const side = facingDir >= 0 ? 1 : -1;
                    const tailSide = side >= 0 ? 'left' : 'right';
                    const bubbleX = playerGroup.position.x + side * 1.25;
                    const bubbleY = playerGroup.position.y + 4.30;
                    spawnSpeechBubble(bubbleWord, bubbleX, bubbleY, tailSide);
                  }
                }, 500);
              }
            }
            continue;
          }

          if (e.state === 'hit') {
            drawEnemy(e);
            if (e.frame > 12) { e.state = 'idle'; e.frame = 0; }
            continue;
          }

          const dx = playerGroup.position.x - e.x;
          const dy = feetY() - e.y;
          const dir = dx >= 0 ? 1 : -1;
          e.group.scale.set(dir * CHAR_SCALE, CHAR_SCALE, CHAR_SCALE);
          e.attackCooldown = Math.max(0, e.attackCooldown - 1);

          if (e.attackTimer > 0) {
            e.state = 'attack';
            e.attackTimer--;

            const active = e.attackTimer <= 24 && e.attackTimer >= 10;
            const range = e.attackType === 'kick' ? 1.20 : 0.95;
            if (active && !e.hasHit && Math.abs(dx) < range && Math.abs(dy) < 1.05) {
              e.hasHit = true;
              if (!(keys.ArrowDown && onGround)) {
                applyDamage(1, 'DEFEATED BY GUARD');
              } else {
                burst(playerGroup.position.x + facingDir * 0.38, playerGroup.position.y + 0.78, 5);
                playSfx('block');
                delayed(() => { if (!gameOver && !audio.muted) playSfxImmediate('playerOoh'); }, 50);
                spawnText('BLOCK', playerGroup.position.x, playerGroup.position.y + 1.22);
              }
            }

            if (e.attackTimer <= 0) {
              e.state = 'idle';
              e.frame = 0;
            }
            drawEnemy(e);
            continue;
          }

          const standingGround = enemyGroundAt(e.x, e.y);
          if (standingGround) {
            e.y = standingGround.y;
            e.group.position.y = e.y;
          }

          if (Math.abs(dx) > 1.15) {
            const step = Math.sign(dx) * 0.035;
            const nextX = e.x + step;
            const nextGround = enemyGroundAt(nextX, e.y);
            if (nextGround && Math.abs(nextGround.y - e.y) < 0.2) {
              e.state = 'walk';
              e.x = nextX;
              e.y = nextGround.y;
              e.group.position.set(e.x, e.y, 0);
            } else {
              e.state = 'idle';
            }
          } else if (Math.abs(dx) <= 1.15 && Math.abs(dy) < 1.05 && e.attackCooldown <= 0) {
            e.state = 'attack';
            e.attackCooldown = 68;
            e.attackTimer = 34;
            e.attackType = Math.random() > 0.5 ? 'punch' : 'kick';
            playSfx('enemyAttack');
            e.battleCryTimeout = delayed(() => { if (!audio.muted) playSfxImmediate(Math.random() > 0.5 ? 'enemyAah' : 'grunt'); }, 60);
            e.hasHit = false;
            e.frame = 0;
          } else {
            e.state = 'idle';
          }

          drawEnemy(e);
        }
      }

      function updateWorldDetails(frameScale = 1) {
        potions.forEach((p, i) => { if (!p.collected) p.group.position.y = p.baseY + Math.sin(animTime * 0.06 + (p.phase || i)) * 0.08; });
      }
      function updateCamera() {
        const target = playerGroup.position;
        const lookX = target.x + orbit.panX;
        const lookY = target.y + 0.65 + orbit.panY;
        const orbitDistanceXZ = Math.max(3.5, Math.cos(orbit.pitch) * orbit.distance);
        const desiredX = lookX + Math.sin(orbit.yaw) * orbitDistanceXZ;
        const desiredY = target.y + orbit.height + orbit.panY + Math.sin(orbit.pitch) * orbit.distance;
        const desiredZ = Math.cos(orbit.yaw) * orbitDistanceXZ;
        camera.position.x += (desiredX - camera.position.x) * 0.08;
        camera.position.y += (desiredY - camera.position.y) * 0.08;
        camera.position.z += (desiredZ - camera.position.z) * 0.08;
        if (cameraShake > 0) { camera.position.x += (Math.random() - 0.5) * cameraShake; camera.position.y += (Math.random() - 0.5) * cameraShake; cameraShake *= 0.86; }
        camera.lookAt(lookX, lookY, 0);
      }

      function updatePerformance(dt) {
        fpsFrames++;
        fpsTime += dt;
        if (fpsTime >= 2.0) {
          currentFPS = fpsFrames / fpsTime;
          fpsFrames = 0;
          fpsTime = 0;
          if (currentFPS < 30 && !lowPerfMode) {
            lowPerfMode = true;
            renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
          } else if (currentFPS >= 50 && lowPerfMode) {
            lowPerfMode = false;
            renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
          }
        }
      }

      function updateUI() {
        const hpEl = $('hpDisplay');
        const walletEl = $('walletDisplay');
        if (hpEl) hpEl.innerText = `HP: ${Math.max(0, hp)}/${maxHp}`;
        if (walletEl) walletEl.innerText = `Wallet: ${wallet} AED`;
      }
      function endGame(msg) {
        if (gameOver) return;
        gameOver = true;
        document.body.classList.add('modalOpen');
        clearPendingTimeouts();
        playSfx(msg === 'VICTORY!' ? 'victory' : 'death');
        document.getElementById('msgText').innerText = msg;
        document.getElementById('msg').style.display = 'block';
      }
      function restartCurrentLevelAfterFall() {
        if (gameOver) return;
        playSfx('death');
        if ($('msg')) $('msg').style.display = 'none';
        document.body.classList.remove('modalOpen');
        loadCurrentLevel(false);
      }
      function restartGame() {
        document.body.classList.remove('modalOpen');
        introActive = false;
        document.getElementById('intro').classList.add('hidden');
        document.getElementById('intro').style.display = 'none';
        renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
        currentLevelIndex = 0;
        if ($('msg')) $('msg').style.display = 'none';
        loadCurrentLevel(true);
      }
      function buyHealth() { if (wallet >= 10 && hp < maxHp && !gameOver) { playSfx('buy'); wallet -= 10; hp++; burst(playerGroup.position.x, playerGroup.position.y + 1.08, 7); spawnText('+HP', playerGroup.position.x, playerGroup.position.y + 1.38); updateUI(); } }
      function startGame() { unlockAudio(); playSfx('start'); startMusic(); restartGame(); }

      safeOn(window, 'keydown', e => {
        unlockAudio();
        if (introActive && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault();
          startGame();
          return;
        }
        if (e.key === 'r' || e.key === 'R') {
          restartGame();
          return;
        }
        if (levelBannerActive && (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === ' ')) {
          e.preventDefault();
          clearGameplayInputs();
          return;
        }
        keys[e.key] = true;
        if (e.key === ' ') e.preventDefault();
      });
      safeOn(window, 'keyup', e => { keys[e.key] = false; });

      function setTouchKey(key, val, btn) {
        if (levelBannerActive && val) {
          keys[key] = false;
          if (btn) btn.classList.remove('active');
          return;
        }
        keys[key] = val;
        if (btn) btn.classList.toggle('active', val);
      }

      document.querySelectorAll('.touchBtn[data-key]').forEach(btn => {
        const key = btn.dataset.key;
        const press = e => { e.preventDefault(); unlockAudio(); setTouchKey(key, true, btn); };
        const release = e => { e.preventDefault(); setTouchKey(key, false, btn); };
        safeOn(btn, 'pointerdown', press);
        safeOn(btn, 'pointerup', release);
        safeOn(btn, 'pointercancel', release);
        safeOn(btn, 'pointerleave', release);
      });

      safeOn($('startButton'), 'click', startGame);
      safeOn($('soundButton'), 'click', toggleSound);

      const musicSlider = $('musicVolumeSlider');
      safeOn(musicSlider, 'input', e => setMusicVolume(e.target.value));
      if (musicSlider) setMusicVolume(musicSlider.value);

      safeOn($('restartButton'), 'click', () => { unlockAudio(); playSfx('start'); restartGame(); });
      safeOn($('restartTouch'), 'pointerdown', e => { e.preventDefault(); unlockAudio(); playSfx('start'); restartGame(); });
      safeOn($('buyButton'), 'click', buyHealth);

      function onResize() {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);

        const nextProfile = getCameraProfile();
        const profileChanged = nextProfile.name !== currentCameraProfileName;
        currentCameraProfileName = nextProfile.name;

        if (profileChanged && !orbit.dragging && !orbit.pinching) {
          orbit.distance = nextProfile.defaultDistance;
          orbit.pinchStartCameraDistance = nextProfile.defaultDistance;
        } else if (!orbit.dragging && !orbit.pinching) {
          orbit.distance = clampCameraDistance(orbit.distance);
          orbit.pinchStartCameraDistance = orbit.distance;
        }
      }
      safeOn(window, 'resize', onResize);
      safeOn(window, 'orientationchange', () => setTimeout(onResize, 50));

      let animationFrameId = 0;

      function animate() {
        animationFrameId = requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const frameScale = dt / 0.0166667;
        animTime += 1; stateFrame++;

        updatePerformance(dt);

        if (!introActive && !gameOver) {
          updatePlayer(frameScale);
          checkSpikes(); updateDynamicObstacles(frameScale); checkPotions(); checkDoors(); checkEnemyHit(); updateEnemies();
        } else {
          enemies.forEach(e => { if (!e.dead) drawEnemy(e); });
        }
        updateAttackVisualAim(); updateWorldDetails(frameScale); updateFX(); updateCamera(); drawStickman(); renderer.render(scene, camera);
      }

      function initializeGame() {
        currentLevelIndex = 0;
        buildLevel(currentLevelIndex);
        const level = LEVELS[currentLevelIndex];
        snapPlayerToGround(level.start.x, level.start.y);
        updateUI();
        orbit.yaw = 0;
        orbit.pitch = 0;
        orbit.height = 1.35;
        orbit.distance = getDefaultCameraDistance();
        orbit.dragging = false;
        orbit.pinching = false;
        orbit.pointerId = null;
        orbit.pointers.clear();
        camera.position.set(level.start.x + 2, 4.8, getDefaultCameraDistance());
        camera.lookAt(level.start.x, level.start.y + 0.8, 0);
        enemies.forEach(drawEnemy);
        drawStickman();
        animate();
      }

      try {
        initializeGame();
      } catch (err) {
        console.error('Game initialization failed:', err);
        cancelAnimationFrame(animationFrameId);
        const msg = $('msg');
        const msgText = $('msgText');
        if (msg && msgText) {
          msgText.innerText = 'INIT ERROR';
          msg.style.display = 'block';
        }
      }
    })();
  </script>
</body>
